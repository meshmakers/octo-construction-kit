# Root-level CI pipeline using shared templates from octo-pipeline-templates.
#
# This IS the pipeline def 104 runs; devops-build/ is gone. The services train
# references def 104 by ID, so a yamlFilename change never affects it.
#
# Construction-kit-specific quirks preserved from the legacy YAML:
#   - NO Docker step — this repo only publishes NuGet packages (11 CK packages)
#   - NO GitSSHGroup / NO InstallSSHKey — no private submodules referenced
#   - NO download-ca — restores from public NuGet feed only
#   - submodules: true (NOT recursive) — matches legacy
#   - Build and Test pass /p:OctoPublishCatalog=LocalFileSystemCatalog: the CK
#     models depend on each other (Basic.Energy -> Basic, EnergyCommunity ->
#     Basic.Energy, …), so the build still publishes each one into the run-
#     isolated local catalog for the next to resolve — and nowhere else.
#   - SystemTests excluded
#   - CK models and blueprints are validated AND published by the shared
#     validate-and-publish-* steps after Test (main -> private catalogs, r* tags ->
#     private AND public), in dependency order. The catalogs release train
#     (ADO 203) still publishes this build's `local` artifact at r-tag time.
#   - The test/0.2-* lane keeps its own blueprint publish into octo-catalog-dev.
#   - HAS push-nuget — the Meshmakers.Octo.Sdk.Packages.* NuGets
#   - HAS the CK library outputs of the CK list below (handle-artifacts)

name: $(MajorVersion).$(MinorVersion).$(date:yyMM).$(DayOfMonth)$(rev:rrr)-$(Build.SourceBranchName)

parameters:
  # Injected by release-services-train on r-tag builds so the whole chain pins
  # the scheduler-determined lib/comm release version (forwarded to
  # update-build-number.yml). Default 'auto' = no override (version computed
  # normally); the train injects the real version on r-tag.
  - name: octoCoreLibVersion
    type: string
    default: 'auto'
  - name: octoCommVersion
    type: string
    default: 'auto'

resources:
  # Chain link: exactly ONE upstream pipeline resource per repo. Pipeline
  # resource triggers do NOT batch, so a repo with two trigger parents is
  # started twice per main cascade. The chain is therefore a single-parent
  # tree; artificial ordering edges (marked below) resolve real DAG joins.
  # Full picture: octo-mesh-deployment/pipelines/orchestrator-ci.yml.
  pipelines:
    - pipeline: octo-common-services
      source: octo-common-services-CI
      trigger:
        branches:
          include:
            - main
  repositories:
    - repository: pipelineTemplates
      type: github
      name: meshmakers/octo-pipeline-templates
      endpoint: meshmakers-access-token
      ref: refs/tags/tpl-v1.0.0

trigger:
  batch: true
  branches:
    include:
      - dev/*
      - test/*
      - main
  tags:
    exclude:
      - '*'

variables:
  - group: ApiKeys-mm-cloud
  - group: OctoDefault
  - name: solutionFile
    value: 'Octo.ConstructionKit.sln'
  - name: artifactsFrameworkVersion
    value: 'net10.0'
  - name: buildConfiguration
    value: 'Release'
  - name: buildPlatform
    value: 'Any CPU'
  - name: isRelease
    value: ${{ startsWith(variables['Build.SourceBranch'], 'refs/tags/r') }}
  - name: isMain
    value: ${{ eq(variables['Build.SourceBranch'], 'refs/heads/main') }}
  - name: isTest
    value: ${{ startsWith(variables['Build.SourceBranch'], 'refs/heads/test') }}
  # ---- Dev catalog for the test/0.2-* lane (AB#5139) ----
  # Blueprint publishing per channel:
  #   main        -> private catalog (meshmakers/blueprint-libraries-build), by the
  #                  shared validate-and-publish-blueprints step (AB#5121; before:
  #                  the inline step below, AB#5422)
  #   r* tags     -> private AND public catalog, by the shared step; the catalogs
  #                  release train (ADO 203) publishes the `local` artifact to both
  #                  again at r-tag time, without -f, so whichever comes second is
  #                  an already-published no-op
  #   test/0.2-*  -> meshmakers/octo-catalog-dev (coordinates here), by the inline
  #                  step below — the shared step cannot retarget the catalog slot
  - name: devCatalogOwner
    value: 'meshmakers'
  - name: devCatalogRepository
    value: 'octo-catalog-dev'
  - name: devCatalogBranch
    value: 'main'
  - name: devCatalogPagesUri
    value: 'https://meshmakers.github.io/octo-catalog-dev/'

stages:
  - stage: Build
    jobs:
      - job: buildAndTest
        displayName: 'Build NuGets and execute tests'
        pool:
          name: meshmakers-ci-agents
        steps:
          - template: templates/steps/update-build-number.yml@pipelineTemplates
            parameters:
              octoCoreLibVersionOverride: ${{ replace(parameters.octoCoreLibVersion, 'auto', '') }}
              octoCommVersionOverride: ${{ replace(parameters.octoCommVersion, 'auto', '') }}
          - checkout: self
            clean: true
            submodules: true
          - template: templates/steps/set-version.yml@pipelineTemplates
          # The build still publishes every CK model, but only into the run-isolated
          # LocalFileSystemCatalog (OctoLocalCatalogRootPath from update-build-number):
          # the models depend on each other, and a dependent resolves a dependency
          # bumped in the same commit only from there. The catalog is named
          # explicitly because CkCompile publishes with isForced hardcoded, and the
          # exported OctoPublishCatalog would otherwise reach MSBuild from the
          # environment (PrivateGitHubCatalog on every branch). The shared CK step
          # after Test is the only publisher to the shared catalogs. The GitHub API
          # keys keep CkCompile's catalog refresh clear of GitHub's unauthenticated
          # rate limit.
          - task: DotNetCoreCLI@2
            retryCountOnTaskFailure: 2
            displayName: 'Build'
            inputs:
              command: 'build'
              projects: '$(solutionFile)'
              arguments: '--configuration $(buildConfiguration) /p:OctoNugetPrivateServer=$(nugetPrivateServer) /p:OctoPublishCatalog=LocalFileSystemCatalog /p:OctoPrivateGitHubApiKey=$(GitHubPAT) /p:OctoPublicGitHubApiKey=$(GitHubPAT)'
              publishWebProjects: false
              zipAfterPublish: false
              modifyOutputPath: false
          - task: DotNetCoreCLI@2
            retryCountOnTaskFailure: 2
            displayName: 'Test'
            inputs:
              command: 'test'
              # Pinned like Build: the implicit build re-enters CkCompile, and without a
              # /p: switch MSBuild takes OctoPublishCatalog from the environment
              # (PrivateGitHubCatalog on every branch) — the leak AB#5413 fixed in
              # octo-construction-kit-engine.
              arguments: '/p:OctoPublishCatalog=LocalFileSystemCatalog'
              projects: |
                **/*Tests.csproj
                !**/*SystemTests.csproj
              testRunTitle: 'CI'
          # CK SemVer and schema gate (AB#4420), and since tpl-v1.0.0 also the publish
          # of the CK models (AB#5121): main -> private catalog, r* tags -> private
          # AND public, never replacing a published version. It runs after Test so a
          # run whose build or tests fail never leaves a version in a shared catalog
          # — a published version cannot be withdrawn. ValidateVersion seeds the
          # step's local catalog, so a model resolves a dependency bumped in the
          # same commit. The step compiles the models itself with the pinned
          # octo-ckc and needs nothing from the build.
          - template: templates/steps/validate-and-publish-ck-versions.yml@pipelineTemplates
            parameters:
              constructionKitPaths:
                - 'src/ConstructionKits/Octo.Sdk.Packages.Basic/ConstructionKit'
                - 'src/ConstructionKits/Octo.Sdk.Packages.Basic.Energy/ConstructionKit'
                - 'src/ConstructionKits/Octo.Sdk.Packages.EnergyCommunity/ConstructionKit'
                - 'src/ConstructionKits/Octo.Sdk.Packages.Environment/ConstructionKit'
                - 'src/ConstructionKits/Octo.Sdk.Packages.Industry.Basic/ConstructionKit'
                - 'src/ConstructionKits/Octo.Sdk.Packages.Industry.Logistics/ConstructionKit'
                - 'src/ConstructionKits/Octo.Sdk.Packages.Industry.Energy/ConstructionKit'
                - 'src/ConstructionKits/Octo.Sdk.Packages.Industry.Fluid/ConstructionKit'
                - 'src/ConstructionKits/Octo.Sdk.Packages.Industry.Maintenance/ConstructionKit'
                - 'src/ConstructionKits/Octo.Sdk.Packages.Industry.Manufacturing/ConstructionKit'
                - 'src/ConstructionKits/Octo.Sdk.Demo/ConstructionKit'
          # Blueprint version-honesty gate (octo-bpm validateVersion, AB#5021), and
          # since tpl-v1.0.0 also the publish: main -> private catalog, r* tags ->
          # private AND public, never replacing a published version. A blueprint
          # whose content changed without a version bump fails the build. The
          # catalogs release train publishes the `local` artifact again at r-tag
          # time, without -f, so the second of the two is an already-published no-op.
          - template: templates/steps/validate-and-publish-blueprints.yml@pipelineTemplates
            parameters:
              blueprintPaths:
                - 'src/Blueprints/Locations.Austria'
                - 'src/Blueprints/Samples.PipelineBasics'
                - 'src/Blueprints/Samples.Maintenance'
                - 'src/Blueprints/Samples.Photovoltaics'
                - 'src/Blueprints/Samples.Simulator.EnergyCommunity'
                - 'src/Blueprints/Samples.EnergyEnvironment'
          - template: templates/steps/handle-artifacts.yml@pipelineTemplates
            parameters:
              # Same 12 published CKs as constructionKitPaths on the
              # validate-ck-versions step above — keep both lists in sync.
              constructionKitLibraryPaths:
                - 'src/ConstructionKits/Octo.Sdk.Demo/bin/$(buildConfiguration)/$(artifactsFrameworkVersion)/octo-ck-libraries/Octo.Sdk.Demo'
                - 'src/ConstructionKits/Octo.Sdk.Packages.Basic/bin/$(buildConfiguration)/$(artifactsFrameworkVersion)/octo-ck-libraries/Octo.Sdk.Packages.Basic'
                - 'src/ConstructionKits/Octo.Sdk.Packages.Basic.Energy/bin/$(buildConfiguration)/$(artifactsFrameworkVersion)/octo-ck-libraries/Octo.Sdk.Packages.Basic.Energy'
                - 'src/ConstructionKits/Octo.Sdk.Packages.EnergyCommunity/bin/$(buildConfiguration)/$(artifactsFrameworkVersion)/octo-ck-libraries/Octo.Sdk.Packages.EnergyCommunity'
                - 'src/ConstructionKits/Octo.Sdk.Packages.Environment/bin/$(buildConfiguration)/$(artifactsFrameworkVersion)/octo-ck-libraries/Octo.Sdk.Packages.Environment'
                - 'src/ConstructionKits/Octo.Sdk.Packages.Industry.Basic/bin/$(buildConfiguration)/$(artifactsFrameworkVersion)/octo-ck-libraries/Octo.Sdk.Packages.Industry.Basic'
                - 'src/ConstructionKits/Octo.Sdk.Packages.Industry.Energy/bin/$(buildConfiguration)/$(artifactsFrameworkVersion)/octo-ck-libraries/Octo.Sdk.Packages.Industry.Energy'
                - 'src/ConstructionKits/Octo.Sdk.Packages.Industry.Fluid/bin/$(buildConfiguration)/$(artifactsFrameworkVersion)/octo-ck-libraries/Octo.Sdk.Packages.Industry.Fluid'
                - 'src/ConstructionKits/Octo.Sdk.Packages.Industry.Logistics/bin/$(buildConfiguration)/$(artifactsFrameworkVersion)/octo-ck-libraries/Octo.Sdk.Packages.Industry.Logistics'
                - 'src/ConstructionKits/Octo.Sdk.Packages.Industry.Maintenance/bin/$(buildConfiguration)/$(artifactsFrameworkVersion)/octo-ck-libraries/Octo.Sdk.Packages.Industry.Maintenance'
                - 'src/ConstructionKits/Octo.Sdk.Packages.Industry.Manufacturing/bin/$(buildConfiguration)/$(artifactsFrameworkVersion)/octo-ck-libraries/Octo.Sdk.Packages.Industry.Manufacturing'
              # Blueprint sources shipped in the `local` artifact so the catalogs
              # release train publishes them at r-tag time. Same list as the
              # validate-blueprints step above — keep both in sync.
              blueprintPaths:
                - 'src/Blueprints/Locations.Austria'
                - 'src/Blueprints/Samples.PipelineBasics'
                - 'src/Blueprints/Samples.Maintenance'
                - 'src/Blueprints/Samples.Photovoltaics'
                - 'src/Blueprints/Samples.Simulator.EnergyCommunity'
                - 'src/Blueprints/Samples.EnergyEnvironment'
          - template: templates/steps/push-nuget-package.yml@pipelineTemplates
          # ---- Blueprint publish, test/0.2-* lane only -> octo-catalog-dev (AB#5139) ----
          # main and r* tags publish through the shared validate-and-publish-blueprints
          # step above (it took over the main lane this step served under AB#5422).
          # The test lane stays here: the shared step cannot point the private
          # catalog slot at the dev catalog repository, and this lane re-publishes a
          # 0.2-dev blueprint under the same version while it is worked on (-f).
          # The blueprint list is ENUMERATED from disk rather than hardcoded a
          # third time — the shared step and handle-artifacts above already carry
          # the authoritative list, and a third copy would drift.
          - task: PowerShell@2
            displayName: 'Publish blueprints to the dev catalog (test lane)'
            # The 0.2-dev lane only. isTest is true for EVERY refs/heads/test*
            # branch (test/will-it-work-on-windows exists), and this step publishes
            # with -f, so a broader condition would let any test branch overwrite
            # the versions the 0.2-dev instance installs.
            condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/heads/test/0.2-'))
            inputs:
              targetType: 'inline'
              pwsh: true
              script: |
                $ErrorActionPreference = 'Stop'
                $toolPath = Join-Path "$(Agent.TempDirectory)" 'octo-tools'

                $blueprints = Get-ChildItem 'src/Blueprints' -Directory |
                  Where-Object { Test-Path (Join-Path $_.FullName 'blueprint.yaml') } |
                  ForEach-Object { $_.FullName }
                if ($blueprints.Count -eq 0) {
                  Write-Host "##vso[task.logissue type=error]No blueprint directory found under src/Blueprints."
                  exit 1
                }
                Write-Host "Found $($blueprints.Count) blueprint(s) to publish."

                # Lane tooling from the PRIVATE feed, not the released 3.x from
                # nuget.org: an older octo-bpm can fail validation on — or silently
                # DROP — properties only the newer schema knows. seedDataPaths
                # (AB#4758) is exactly such a property, and dropping it publishes a
                # blueprint that installs an empty seed and still reports success.
                $nugetSource = '$(nugetPrivateServer)'
                $toolVersion = "$(MajorVersion).$(MinorVersion).*"
                $nugetConfig = Join-Path "$(Agent.TempDirectory)" 'octo-bpm-nuget.config'
                Set-Content -Path $nugetConfig -Encoding utf8 -Value @(
                  '<?xml version="1.0" encoding="utf-8"?>',
                  '<configuration>',
                  '  <packageSources>',
                  '    <clear />',
                  '    <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />',
                  ('    <add key="octo-private" value="' + $nugetSource + '" />'),
                  '  </packageSources>',
                  '</configuration>'
                )

                Write-Host "Installing octo-bpm $toolVersion from $nugetSource..."
                dotnet tool install Meshmakers.Octo.BlueprintManager --version "$toolVersion" --tool-path "$toolPath" --configfile "$nugetConfig"
                if ($LASTEXITCODE -ne 0) {
                  Write-Host "##vso[task.logissue type=error]octo-bpm tool install failed - does Meshmakers.Octo.BlueprintManager $toolVersion exist on $nugetSource? Has the engine CI built this version line yet?"
                  exit 1
                }

                # Isolate the tool's user profile: `config` persists the PAT to
                # <home>/.octo-bpm/settings.json and caches catalogs under <home>/.octo,
                # and on these self-hosted agents the real HOME outlives the job.
                # After the install so the NuGet cache stays warm.
                $bpmHome = Join-Path "$(Agent.TempDirectory)" 'octo-bpm-home'
                New-Item -ItemType Directory -Force -Path $bpmHome | Out-Null
                $env:HOME = $bpmHome
                $env:USERPROFILE = $bpmHome
                $bpm = Join-Path $toolPath 'octo-bpm'

                # Point the PRIVATE catalog slot at the dev repository, with the LOCAL
                # blueprint catalog disabled: it outranks the GitHub ones on read, so a
                # stray local blueprint must never win over what we publish.
                Write-Host "Pointing octo-bpm's private catalog at $(devCatalogOwner)/$(devCatalogRepository)..."
                & $bpm -c config -go "$(devCatalogOwner)" -gr "$(devCatalogRepository)" -gb "$(devCatalogBranch)" -gp "$(devCatalogPagesUri)" -gt "$(GitHubPAT)" -lce false
                if ($LASTEXITCODE -ne 0) { Write-Host "##vso[task.logissue type=error]octo-bpm config failed"; exit 1 }

                foreach ($blueprint in $blueprints) {
                  $name = Split-Path $blueprint -Leaf
                  Write-Host ""
                  Write-Host "##[group]Blueprint $name"
                  & $bpm -c validate -p "$blueprint"
                  if ($LASTEXITCODE -ne 0) { Write-Host "##vso[task.logissue type=error]blueprint validation failed: $name"; exit 1 }

                  $out = & $bpm -c publish -p "$blueprint" -c 'PrivateGitHubBlueprintCatalog' -f 2>&1
                  $out | ForEach-Object { Write-Host $_ }
                  # octo-bpm can soft-fail with exit 0 (logs the error and returns),
                  # so assert on the output instead of trusting the exit code.
                  if (($out -join "`n") -notmatch 'published successfully to catalog') {
                    Write-Host "##vso[task.logissue type=error]octo-bpm publish of $name did not report success"
                    exit 1
                  }
                  Write-Host "##[endgroup]"
                }
                Write-Host ""
                Write-Host "Blueprints published to $(devCatalogRepository) ($($blueprints.Count))."
          - task: PowerShell@2
            displayName: 'Clean up octo tool PAT settings'
            condition: always()
            inputs:
              targetType: 'inline'
              pwsh: true
              script: |
                # `config` persists the PAT into the tool's user settings file and the
                # agents are shared. The step above points HOME at Agent.TempDirectory
                # before configuring, which already covers it — this is the safety net
                # for a build that predates the isolation or skips that step.
                foreach ($settings in @((Join-Path $HOME '.octo-bpm/settings.json'), (Join-Path $HOME '.octo-ckc/settings.json'))) {
                  if (Test-Path $settings) { Remove-Item -Force $settings }
                }
