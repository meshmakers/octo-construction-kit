$schema: https://schemas.meshmakers.cloud/blueprint-meta.schema.json
blueprintId: Monitoring.BlueprintHealth-1.0.0
description: |
  Blueprint installation health, reported to Dash0 (AB#5429).

  Blueprints provision tenants, so a blueprint that did not land the way it was
  meant to does not announce itself - it surfaces weeks later as a
  misconfigured tenant, found by a person rather than by a check. Before this
  blueprint there was no signal at all: not a missing alert rule, a missing
  data source.

  Installs an hourly cron pipeline that reads the tenant's OWN blueprint state
  and pushes OTLP metrics to Dash0. One fault gauge and one liveness gauge:

    octo.blueprint.installation.state{octo.tenant.id, octo.blueprint.name,
                                      octo.blueprint.version,
                                      octo.blueprint.state}
      1 = VersionDrift      the catalog offers a newer version than the one
                            this tenant runs. octo.blueprint.version is the
                            INSTALLED version. Warning: nothing is broken, the
                            tenant is behind.
      2 = CatalogUnreadable the drift check for this blueprint could not be
                            performed (token or asset-services call failed).
                            Critical, and explicitly NOT an all-clear: it says
                            the answer for this blueprint is unknown this run,
                            which is the same reasoning that makes
                            CkHealthTenantUnreachable critical.
      3 = NotInstalled      a blueprint listed as an ExpectedBlueprint has no
                            installation row. octo.blueprint.version is
                            "(none)". Critical - see "What a failed install
                            looks like" below.

      The numbering is severity-monotonic on purpose: a check rule can mirror
      CkModelResolveFailed with ">= $__threshold" and get every critical with
      one expression, or use "== $__threshold" per state for a precise summary.
      A non-monotonic encoding would silently make ">= 2" catch a warning too.

      Named for the fault and emitted only when it occurs, exactly like
      octo.ck.library.state: a rule alerts on "> 0", the series ages out when
      the fault is gone, and there is no all-clear value anywhere to get wrong.

    octo.blueprint.monitor.heartbeat{octo.tenant.id}
      Liveness. UNCONDITIONAL, always 1, emitted once at the pipeline's last
      node, so its presence means the run completed.

      Fault-only metrics have one blind spot and it is total: a healthy tenant
      and a dead monitor look identical. On 2026-09-29 the CK health monitor
      produced nothing for four hours and no rule could say anything about it.
      This is the same convention Monitoring.CkHealth 2.2.0 adopted for
      AB#5426 - deliberately adopted rather than reinvented.

      One difference, forced by the topology and worth knowing: CkHealth emits
      TWO liveness gauges, octo.ck.monitor.heartbeat (per monitored tenant) and
      octo.ck.monitor.run (per run, no tenant label), because one CkHealth run
      covers many tenants. Here every run covers exactly one tenant, so the two
      collapse into one series and a separate run-level gauge would be a
      duplicate. There is deliberately no octo.blueprint.monitor.run.

  Why this one runs INSIDE the tenant it watches

  CkHealth is installed into an operations tenant and reaches out. This
  blueprint cannot copy that, and the reason is not a preference:

    - The state it reads, System/BlueprintInstallation, lives in the tenant's
      own runtime repository. There is no cross-tenant collection
      (EntityTenantBlueprintInstallations). A pipeline reads it with
      GetRtEntitiesByType - no token, no HTTP, no auth to get wrong.
    - A client-credentials token is bound to one tenant. AB#5032 closed the
      cross-tenant hole and AB#5077 made enforcement the default; a foreign
      tenant answers 403. CkHealth works around that with client mirroring plus
      acr_values (AB#5423). Reading local state needs none of it.
    - CrossTenantServiceClientIds is a permanent cross-tenant hole and is
      deliberately NOT used.

  Per-tenant opt-in is therefore the install decision itself: a tenant is
  watched exactly when this blueprint is installed in it. There is no list of
  tenants anywhere, nothing to keep in sync, and a tenant that is not meant to
  be watched cannot accidentally be. Instance-wide coverage is not assumed and
  not achievable by accident.

  The price is that the watchdog shares fate with its patient: a tenant whose
  CK models are ResolveFailed will fail this pipeline too, and a tenant whose
  adapter is deaf (AB#5409) will not run it. That is exactly what the
  unconditional heartbeat is for - its absence is the alert. A monitor that
  can only report while everything works is worth nothing, which is why the
  heartbeat is not optional here.

  What a failed install looks like, honestly

  It looks like nothing. BlueprintService returns Failed and calls
  NotifyApplyFailedAsync BEFORE writing anything: no installation row, no
  history entry, no error entity. The only artifacts are the HTTP 400 handed
  back to whoever called Apply and a log line. Nothing in the tenant's data
  records that an install was attempted and failed.

  So this blueprint cannot detect a failed install directly, and does not
  pretend to. It detects the shadow: a blueprint named in the ExpectedBlueprint
  list that has no installation row. That covers a failed apply, an apply that
  was never run, and a rollback - which is what one actually wants to know -
  but only for blueprints someone wrote down. A tenant with an empty
  ExpectedBlueprint list gets drift monitoring and a heartbeat, and no
  NotInstalled findings ever. Persisting failed applies belongs in the engine,
  not here; see the follow-up note in the work item.

  What it deliberately does NOT detect

    - Non-runtime state clobbered by a re-apply (System/Enabled reset and the
      like). The event is visible - System/BlueprintHistory records
      ApplicationMode "Reapply" - but turning "a re-apply happened" into a
      finding needs a time window, and comparing DateTime values inside a
      pipeline is fragile enough that a wrong answer here would be worse than
      no answer. Left out on purpose rather than approximated.
    - Broken dependency graphs. BlueprintInstallation.ResolvedDependencies
      holds full "Name-Version" ids, and splitting them to check each against
      the installed set needs string surgery in pipeline YAML for a weak
      signal.

  Cardinality, deliberately

  Dash0 spend on test-2 doubled in a single day (~$361 on 2026-09-29), so the
  label set is an explicit cost decision, not a default:

    - The fault gauge is fault-only, so the live series count is the number of
      ACTUALLY broken installations, not tenants x blueprints x versions.
      A healthy fleet emits exactly one series per tenant: the heartbeat.
    - octo.blueprint.version carries the INSTALLED version only. The catalog's
      recommended version is deliberately not a label: it changes for every
      lagging tenant at once on every publish, which makes it the largest
      series generator of the candidates, and it is one catalog lookup away
      when an alert fires.
    - The heartbeat carries only octo.tenant.id. Adding an environment label
      would be free in cardinality terms but would diverge from
      octo.ck.monitor.heartbeat for no gain.

  Alerting is NOT part of this blueprint: the check rules live with the other
  Dash0 rules in meshmakers-infrastructure, so this shares one notification
  channel, one history and the same resolve-on-fix behaviour as every other
  alert. The rules mirror CkModelResolveFailed.

  Requirements

    - The tenant must have Communication enabled, with a pool and the seeded
      Mesh Adapter (rtId 670000000000000000000002). The pipeline is associated
      to that adapter by id, and installing into a tenant that has none
      produces NO error at all: the blueprint applies, the trigger appears,
      System/Enabled is true, LastDeploymentError is null - and the pipeline
      sits at DeploymentState Undeployed forever. That is how the CK monitor
      spent four hours doing nothing on 2026-09-29 (AB#5426). Check with
      `octo-cli -c GetAdapters` BEFORE installing; an empty list is the wrong
      tenant.
    - System CK model 2.2.0 or newer, for the System/BlueprintInstallation and
      System/BlueprintHistory types. It is service-managed and present on every
      current platform, which is why it is not listed as a ckModelDependency -
      naming it there would ask the engine to install an exact lower-bound
      version of a model it manages itself.

  Post-install steps:
    1. Edit the "Blueprint Health Monitor Configuration" entity. TenantId is
       already filled in from ${octo.tenantId} - leave it alone. Set:
       TokenUrl (the /connect/token endpoint), AssetServicesBaseUrl (no
       trailing slash), ClientId/ClientSecret of a ClientCredentials client IN
       THIS TENANT with asset read access, Scope (octo_api or
       octo_api.read_only), Dash0IngressUrl (base URL, no path - the pipeline
       appends /v1/metrics), Dash0AuthToken (ingest-only is enough),
       Dash0Dataset.
    2. Optional: add one "Expected Blueprint" entity per blueprint this tenant
       must be running. Without any, NotInstalled can never fire. Keep the list
       in version control as an ImportRt file with fixed rtIds and apply it
       with `octo-cli -c ImportRt -f <file> -w`, so a rebuilt tenant gets its
       expectations back from git rather than from memory. It is deliberately
       not seeded here: this blueprint is published to a public catalog and
       must not carry customer blueprint names.
    3. Deploy the DataFlow and activate the trigger:
       octo-cli -c DeployDataFlow --identifier 0c4eb1000000000000000001
       octo-cli -c DeployTriggers
    4. Smoke test without waiting for the cron:
       octo-cli -c ExecutePipeline --identifier 0c4eb1000000000000000002
       Then check the HEARTBEAT in Dash0, not the findings - the findings are
       fault-only, so an empty result proves nothing either way. Metrics appear
       about a minute after ingest, not instantly:
       {otel_metric_name="octo.blueprint.monitor.heartbeat"}
    5. Confirm the deployment actually took rather than assuming it did:
       octo-cli -c GetDataFlowStatus -id 0c4eb1000000000000000001
       State must not be 0 (Undeployed) and LastExecutionAt must not be null
       after the smoke test.

  Notes: a force re-apply (InstallBlueprint -f) resets the configuration entity
  to its placeholders - reconfigure afterwards. The Dash0 token is stored as a
  plain attribute, and Dash0 exposes its first characters as a
  dash0_auth_token label on every ingested series. The Dash0 pushes use
  onHttpError Throw, so an unreachable ingress fails the execution visibly
  instead of reporting a clean run with nothing sent; the token and catalog
  calls use LogAndStop, so a broken credential degrades to CatalogUnreadable
  per blueprint instead of ending the run for everything else.

ckModelDependencies:
  # Satisfiability floor only, NOT the install target: System.Communication is
  # service-managed and the install is redirected to the
  # IServiceManagedCkModelDescriptor version (AB#4294).
  - System.Communication-[3.22.0,4.0)
  # Floor pinned to the published version (the engine installs the range's
  # lower bound as an exact version). 2.1.0 is the version that introduces
  # BlueprintHealthMonitorConfig and ExpectedBlueprint.
  #
  # A tenant that also hosts Monitoring.CkHealth (floor 2.0.0) is fine in both
  # orders: EnsureCkModelInstalledAsync skips the import when a
  # satisfying-or-higher version is already installed, and re-imports when the
  # installed version is strictly older.
  - Monitoring-[2.1.0,3.0)
seedDataPaths:
  - seed-data/master-data/monitor-config.yaml
  - seed-data/data-flows/blueprint-health-check.yaml
