$schema: https://schemas.meshmakers.cloud/runtime-model.schema.json
dependencies:
- System.Communication-[3.1,4.0)
- Monitoring-[2.1,3.0)
entities:
  # ==========================================================================
  # Blueprint installation health (AB#5429)
  #
  # Hourly cron pipeline. Reads THIS tenant's own blueprint state and reports it to Dash0 as
  # OTLP metrics. Runs on the Mesh Adapter that System.Communication seeds
  # (rtId 670000000000000000000002).
  #
  # Why in-tenant and not cross-tenant like Monitoring.CkHealth: System/BlueprintInstallation
  # entities live in the tenant's own runtime repository - there is no cross-tenant collection
  # (EntityTenantBlueprintInstallations) - and a client-credentials token is bound to one tenant
  # since AB#5032/AB#5077. Reading local state needs no token, no mirroring, no acr_values and
  # no CrossTenantServiceClientIds exemption. Per-tenant opt-in is then the install decision
  # itself: this blueprint is installed exactly in the tenants that are meant to be watched.
  #
  # Metrics:
  #   octo.blueprint.installation.state  fault-only, per tenant+blueprint.
  #                            1 = VersionDrift, 2 = CatalogUnreadable, 3 = NotInstalled -
  #                            numbered so severity rises with the value, which is what lets a
  #                            check rule mirror CkModelResolveFailed with ">= threshold".
  #                            Healthy installations are NOT emitted: a rule on "> 0" then has
  #                            nothing to fire on and the series ages out once repaired.
  #   octo.blueprint.monitor.heartbeat   1 per RUN, UNCONDITIONAL, at the last node. Since one
  #                            run covers exactly one tenant, this is simultaneously the
  #                            per-tenant and the per-run pulse that Monitoring.CkHealth 2.2.0
  #                            has to split into octo.ck.monitor.heartbeat and
  #                            octo.ck.monitor.run. There is deliberately no
  #                            octo.blueprint.monitor.run.
  #
  # Attribute keys arrive as PromQL labels with dots turned into underscores
  # (octo.tenant.id -> octo_tenant_id); the metric NAME keeps its dots.
  # ==========================================================================

  # --- DataFlow ---
  - rtId: '0c4eb1000000000000000001'
    ckTypeId: System.Communication/DataFlow-1
    attributes:
      - id: System/Name-1
        value: Blueprint Installation Health
      - id: System/Description-1
        value: Scheduled check of this tenant's blueprint installations against the catalog and against the expected list, reported to Dash0 as OTLP metrics.

  # --- Pipeline ---
  - rtId: '0c4eb1000000000000000002'
    ckTypeId: System.Communication/Pipeline-1
    associations:
      - roleId: System/ParentChild-1
        targetRtId: '0c4eb1000000000000000001'
        targetCkTypeId: System.Communication/DataFlow-1
      - roleId: System.Communication/Executes-1
        targetRtId: '670000000000000000000002'
        targetCkTypeId: System.Communication/Adapter-1
    attributes:
      - id: System/Name-1
        value: blueprint-health-check
      - id: System/Description-1
        value: Emits octo.blueprint.installation.state and the octo.blueprint.monitor.heartbeat liveness gauge for this tenant to Dash0.
      - id: System/Enabled-1
        value: true
      - id: System.Communication/DeploymentState-1
        value: 0
      - id: System.Communication/PipelineDefinition-1
        value: |
          triggers:
            - type: FromPipelineTriggerEvent@1
            - type: FromExecutePipelineCommand@1
          transformations:
            - type: GetRtEntitiesByType@1
              description: Load monitor configuration
              ckTypeId: Monitoring/BlueprintHealthMonitorConfig
              targetPath: $.cfg
            - type: ExecuteCSharp@1
              description: >-
                OTLP wants nanoseconds since the Unix epoch. DateTime@1 offers Now but has no
                conversion in that direction (only FromUnixTimeMilliseconds, the other way round),
                so a one-line script is the only way to produce the field. Emitted as a string
                because that is what the OTLP JSON encoding expects. The script text carries no
                values, so it compiles once and is shared process-wide.
              code: "return (DateTimeOffset.UtcNow.ToUnixTimeMilliseconds() * 1000000L).ToString();"
              returnType: String
              targetPath: $.nowUnixNano
            - type: FormatString@1
              description: Dash0 OTLP/HTTP metrics endpoint; the configured value carries no path
              format: "{$.cfg.Items[0].Attributes.Dash0IngressUrl}/v1/metrics"
              targetPath: $.otlpUrl
            - type: FormatString@1
              description: Build the Dash0 Authorization header value
              format: "Bearer {$.cfg.Items[0].Attributes.Dash0AuthToken}"
              targetPath: $.dash0AuthHeader

            # --- Local state, no network involved ---
            #
            # identity: System on purpose. The blueprint registry is platform metadata, not
            # business data, and a row hidden from the pipeline's service account by a data
            # permission (AB#4969) would be indistinguishable from a row that is not there -
            # i.e. it would be reported as NotInstalled. A monitor must not be able to invent a
            # fault out of its own lack of privilege.
            #
            # take is a hard cap, not a page size, and there is no continuation loop here. No
            # tenant comes close to 500 installed blueprints; the cap exists so an unbounded
            # read can never be the thing that kills the monitor.
            - type: GetRtEntitiesByType@1
              description: Load this tenant's installed blueprints
              ckTypeId: System/BlueprintInstallation
              identity: System
              take: 500
              targetPath: $.installed
            - type: GetRtEntitiesByType@1
              description: Load the blueprints this tenant is expected to run
              ckTypeId: Monitoring/ExpectedBlueprint
              take: 200
              targetPath: $.expected

            # ================================================================
            # Pass A - expected but absent.
            #
            # This is the only way a FAILED INSTALL becomes observable at all. BlueprintService
            # returns Failed and calls NotifyApplyFailedAsync before writing anything: no
            # installation row, no history entry, no error entity. Nothing in the tenant records
            # that an apply was attempted and failed. "Named as expected, and not there" is the
            # only shadow it casts - and it also covers an apply that was never run and one that
            # was rolled back, which is what one actually wants to know.
            #
            # Needs no token and no network except the Dash0 push, so it keeps working when the
            # service client's secret has expired - which is exactly when a tenant is most
            # likely to be in a half-provisioned state.
            # ================================================================
            - type: ForEach@1
              description: Report every expected blueprint that has no installation row
              path: $
              iterationPath: $.expected.Items
              targetPath: $.expectedChecked
              errorsPath: $.runErrors.expected
              continueOnError: true
              maxDegreeOfParallelism: 1
              transformations:
                - type: GetRtEntitiesByType@1
                  description: Targeted lookup instead of a set operation - pipeline YAML has no "contains"
                  ckTypeId: System/BlueprintInstallation
                  identity: System
                  take: 1
                  fieldFilters:
                    - attributePath: BlueprintName
                      operator: Equals
                      comparisonValuePath: $.key.Attributes.BlueprintName
                  targetPath: $.key.found
                # If@1 reads an absent path as null and does not throw, and Equals with no value
                # compares null against null - so an empty Items array is the "not installed"
                # gate. SetPrimitiveValue and FormatString would THROW on the same absent path,
                # which is why the check is an If and not a comparison built out of a formatted
                # string.
                - type: If@1
                  description: Only blueprints with no installation row at all
                  path: $.key.found.Items[0]
                  operator: Equals
                  transformations:
                    # A dynamic JSON body has to be assembled as an OBJECT: MakeHttpRequest
                    # serialises whatever bodyPath points at, so a pre-formatted JSON string
                    # would be sent as a quoted string. The skeleton carries the full OTLP shape
                    # and the leaves are filled in below. octo.blueprint.version is the literal
                    # "(none)" here: there is no installed version, and leaving the label off
                    # would split the metric into two different label sets.
                    - type: WriteJson@1
                      description: OTLP/HTTP metrics envelope, NotInstalled
                      jsonString: |
                        {"resourceMetrics":[{"resource":{"attributes":[
                          {"key":"service.name","value":{"stringValue":"octo-blueprint-health-monitor"}}]},
                         "scopeMetrics":[{"scope":{"name":"Monitoring.BlueprintHealth","version":"1.0.0"},
                          "metrics":[{"name":"octo.blueprint.installation.state","unit":"{state}",
                           "description":"1 = version drift, 2 = catalog unreadable, 3 = expected blueprint not installed",
                           "gauge":{"dataPoints":[{"timeUnixNano":"","asInt":"3","attributes":[
                             {"key":"octo.tenant.id","value":{"stringValue":""}},
                             {"key":"octo.blueprint.name","value":{"stringValue":""}},
                             {"key":"octo.blueprint.version","value":{"stringValue":"(none)"}},
                             {"key":"octo.blueprint.state","value":{"stringValue":"NotInstalled"}}]}]}}]}]}]}
                      targetPath: $.key.otlp
                    - type: SetPrimitiveValue@1
                      valuePath: $.full.nowUnixNano
                      valueType: String
                      targetPath: $.key.otlp.resourceMetrics[0].scopeMetrics[0].metrics[0].gauge.dataPoints[0].timeUnixNano
                    - type: SetPrimitiveValue@1
                      valuePath: $.full.cfg.Items[0].Attributes.TenantId
                      valueType: String
                      targetPath: $.key.otlp.resourceMetrics[0].scopeMetrics[0].metrics[0].gauge.dataPoints[0].attributes[0].value.stringValue
                    - type: SetPrimitiveValue@1
                      valuePath: $.key.Attributes.BlueprintName
                      valueType: String
                      targetPath: $.key.otlp.resourceMetrics[0].scopeMetrics[0].metrics[0].gauge.dataPoints[0].attributes[1].value.stringValue
                    - type: MakeHttpRequest@1
                      description: >-
                        Push to Dash0. Throw on error: a monitor that silently fails to report is
                        worse than one that fails loudly, and the surrounding ForEach records the
                        error per item instead of ending the run.
                      method: POST
                      urlPath: $.full.otlpUrl
                      bodyPath: $.key.otlp
                      bodyContentType: application/json
                      headerParameters:
                        - name: Authorization
                          valuePath: $.full.dash0AuthHeader
                        - name: Dash0-Dataset
                          valuePath: $.full.cfg.Items[0].Attributes.Dash0Dataset
                      onHttpError: Throw
                      retry:
                        maxAttempts: 3
                      targetPath: $.key.otlpResponse

            # ================================================================
            # Pass B - catalog drift.
            #
            # {tenantId}/v1/blueprints/updates?blueprintName=X answers hasUpdate/recommendedVersion
            # for THIS tenant, so it needs a bearer token - but only one for this tenant. No
            # mirroring, no acr_values: the client lives here.
            #
            # The token is acquired INSIDE the iteration, once per installed blueprint, and that
            # is deliberate even though it is wasteful. onHttpError LogAndStop makes the node log
            # and return WITHOUT running the rest of THIS iteration; at the top level the same
            # setting would skip the rest of the PIPELINE, heartbeat included, and a monitor
            # whose expired secret also silences its own pulse is the failure mode this work item
            # exists to remove. Throw at the top level would end the run outright. Keeping the
            # token call inside a continueOnError ForEach contains both. At hourly cadence with a
            # handful of blueprints the extra token calls are noise.
            # ================================================================
            - type: ForEach@1
              description: Check every installed blueprint against the catalog
              path: $
              iterationPath: $.installed.Items
              targetPath: $.installedChecked
              errorsPath: $.runErrors.installed
              continueOnError: true
              maxDegreeOfParallelism: 1
              transformations:
                - type: WriteJson@1
                  description: Token request body (client_credentials)
                  jsonString: '{"grant_type":"client_credentials"}'
                  targetPath: $.key.tokenRequest
                - type: SetPrimitiveValue@1
                  valuePath: $.full.cfg.Items[0].Attributes.ClientId
                  valueType: String
                  targetPath: $.key.tokenRequest.client_id
                - type: SetPrimitiveValue@1
                  valuePath: $.full.cfg.Items[0].Attributes.ClientSecret
                  valueType: String
                  targetPath: $.key.tokenRequest.client_secret
                - type: SetPrimitiveValue@1
                  valuePath: $.full.cfg.Items[0].Attributes.Scope
                  valueType: String
                  targetPath: $.key.tokenRequest.scope
                - type: MakeHttpRequest@1
                  description: >-
                    Acquire an access token for this tenant. LogAndStop, not Throw - a dead
                    credential must degrade to CatalogUnreadable for this blueprint (pass C),
                    not end the run.
                  method: POST
                  urlPath: $.full.cfg.Items[0].Attributes.TokenUrl
                  bodyPath: $.key.tokenRequest
                  bodyContentType: application/x-www-form-urlencoded
                  onHttpError: LogAndStop
                  retry:
                    maxAttempts: 3
                  targetPath: $.key.token
                - type: FormatString@1
                  description: Build Authorization header value
                  format: "Bearer {$.key.token.access_token}"
                  targetPath: $.key.authHeader
                - type: FormatString@1
                  description: Build the per-blueprint update-check URL
                  format: "{$.full.cfg.Items[0].Attributes.AssetServicesBaseUrl}/{$.full.cfg.Items[0].Attributes.TenantId}/v1/blueprints/updates?blueprintName={$.key.Attributes.BlueprintName}"
                  targetPath: $.key.updatesUrl
                - type: MakeHttpRequest@1
                  description: >-
                    Ask the catalog what it offers for this blueprint. LogAndStop for the same
                    reason as the token call: the item stays collected (just without an `update`),
                    which is what lets pass C name the blueprint. With Throw the iteration aborts
                    and ForEach records only {index, errorType, message} - the failing item itself
                    is not carried over (ForEachNode.BuildIterationErrors), so the blueprint would
                    be unnameable.
                  method: GET
                  urlPath: $.key.updatesUrl
                  headerParameters:
                    - name: Authorization
                      valuePath: $.key.authHeader
                  onHttpError: LogAndStop
                  retry:
                    maxAttempts: 3
                  targetPath: $.key.update
                - type: If@1
                  description: >-
                    hasUpdate is true only when the catalog holds a version above the installed
                    one. A tenant that is deliberately pinned below the catalog therefore alerts,
                    and that is intended: "behind on purpose" and "behind by accident" are
                    indistinguishable from the tenant's own data, and the warning severity says
                    which of the two is being claimed.
                  path: $.key.update.hasUpdate
                  operator: Equals
                  value: true
                  valueType: Boolean
                  transformations:
                    # octo.blueprint.version carries the INSTALLED version only. The catalog's
                    # recommendedVersion is deliberately NOT a label: it moves for every lagging
                    # tenant at once on every publish, which makes it the biggest series
                    # generator of the candidates, and it is one catalog lookup away when the
                    # alert fires. Dash0 spend on test-2 doubled in a single day on 2026-09-29.
                    - type: WriteJson@1
                      description: OTLP/HTTP metrics envelope, VersionDrift
                      jsonString: |
                        {"resourceMetrics":[{"resource":{"attributes":[
                          {"key":"service.name","value":{"stringValue":"octo-blueprint-health-monitor"}}]},
                         "scopeMetrics":[{"scope":{"name":"Monitoring.BlueprintHealth","version":"1.0.0"},
                          "metrics":[{"name":"octo.blueprint.installation.state","unit":"{state}",
                           "description":"1 = version drift, 2 = catalog unreadable, 3 = expected blueprint not installed",
                           "gauge":{"dataPoints":[{"timeUnixNano":"","asInt":"1","attributes":[
                             {"key":"octo.tenant.id","value":{"stringValue":""}},
                             {"key":"octo.blueprint.name","value":{"stringValue":""}},
                             {"key":"octo.blueprint.version","value":{"stringValue":""}},
                             {"key":"octo.blueprint.state","value":{"stringValue":"VersionDrift"}}]}]}}]}]}]}
                      targetPath: $.key.otlp
                    - type: SetPrimitiveValue@1
                      valuePath: $.full.nowUnixNano
                      valueType: String
                      targetPath: $.key.otlp.resourceMetrics[0].scopeMetrics[0].metrics[0].gauge.dataPoints[0].timeUnixNano
                    - type: SetPrimitiveValue@1
                      valuePath: $.full.cfg.Items[0].Attributes.TenantId
                      valueType: String
                      targetPath: $.key.otlp.resourceMetrics[0].scopeMetrics[0].metrics[0].gauge.dataPoints[0].attributes[0].value.stringValue
                    - type: SetPrimitiveValue@1
                      valuePath: $.key.Attributes.BlueprintName
                      valueType: String
                      targetPath: $.key.otlp.resourceMetrics[0].scopeMetrics[0].metrics[0].gauge.dataPoints[0].attributes[1].value.stringValue
                    - type: SetPrimitiveValue@1
                      valuePath: $.key.Attributes.BlueprintVersion
                      valueType: String
                      targetPath: $.key.otlp.resourceMetrics[0].scopeMetrics[0].metrics[0].gauge.dataPoints[0].attributes[2].value.stringValue
                    - type: MakeHttpRequest@1
                      description: Push the drift finding to Dash0
                      method: POST
                      urlPath: $.full.otlpUrl
                      bodyPath: $.key.otlp
                      bodyContentType: application/json
                      headerParameters:
                        - name: Authorization
                          valuePath: $.full.dash0AuthHeader
                        - name: Dash0-Dataset
                          valuePath: $.full.cfg.Items[0].Attributes.Dash0Dataset
                      onHttpError: Throw
                      retry:
                        maxAttempts: 3
                      targetPath: $.key.otlpResponse

            # ================================================================
            # Pass C - blueprints whose drift check could not be performed.
            #
            # Iterates the COLLECTED items of pass B rather than its error list, because the
            # collected item still carries the blueprint while a ForEach error entry carries only
            # {index, errorType, message}. A missing `update` is the signal.
            #
            # This is reported as a finding rather than swallowed because its absence would
            # otherwise read as an all-clear: "no drift alert for this blueprint" and "we could
            # not look" are not the same statement, and the fault-only shape of the metric means
            # nothing else would ever say so.
            # ================================================================
            - type: ForEach@1
              description: Report blueprints whose catalog answer never arrived
              path: $
              iterationPath: $.installedChecked
              targetPath: $.catalogGaps
              maxDegreeOfParallelism: 1
              transformations:
                - type: If@1
                  description: Only blueprints without an update response
                  path: $.key.update
                  operator: Equals
                  transformations:
                    - type: WriteJson@1
                      description: OTLP/HTTP metrics envelope, CatalogUnreadable
                      jsonString: |
                        {"resourceMetrics":[{"resource":{"attributes":[
                          {"key":"service.name","value":{"stringValue":"octo-blueprint-health-monitor"}}]},
                         "scopeMetrics":[{"scope":{"name":"Monitoring.BlueprintHealth","version":"1.0.0"},
                          "metrics":[{"name":"octo.blueprint.installation.state","unit":"{state}",
                           "description":"1 = version drift, 2 = catalog unreadable, 3 = expected blueprint not installed",
                           "gauge":{"dataPoints":[{"timeUnixNano":"","asInt":"2","attributes":[
                             {"key":"octo.tenant.id","value":{"stringValue":""}},
                             {"key":"octo.blueprint.name","value":{"stringValue":""}},
                             {"key":"octo.blueprint.version","value":{"stringValue":""}},
                             {"key":"octo.blueprint.state","value":{"stringValue":"CatalogUnreadable"}}]}]}}]}]}]}
                      targetPath: $.key.otlp
                    - type: SetPrimitiveValue@1
                      valuePath: $.full.nowUnixNano
                      valueType: String
                      targetPath: $.key.otlp.resourceMetrics[0].scopeMetrics[0].metrics[0].gauge.dataPoints[0].timeUnixNano
                    - type: SetPrimitiveValue@1
                      valuePath: $.full.cfg.Items[0].Attributes.TenantId
                      valueType: String
                      targetPath: $.key.otlp.resourceMetrics[0].scopeMetrics[0].metrics[0].gauge.dataPoints[0].attributes[0].value.stringValue
                    - type: SetPrimitiveValue@1
                      valuePath: $.key.Attributes.BlueprintName
                      valueType: String
                      targetPath: $.key.otlp.resourceMetrics[0].scopeMetrics[0].metrics[0].gauge.dataPoints[0].attributes[1].value.stringValue
                    - type: SetPrimitiveValue@1
                      valuePath: $.key.Attributes.BlueprintVersion
                      valueType: String
                      targetPath: $.key.otlp.resourceMetrics[0].scopeMetrics[0].metrics[0].gauge.dataPoints[0].attributes[2].value.stringValue
                    - type: MakeHttpRequest@1
                      description: Push the unreadable-catalog finding to Dash0
                      method: POST
                      urlPath: $.full.otlpUrl
                      bodyPath: $.key.otlp
                      bodyContentType: application/json
                      headerParameters:
                        - name: Authorization
                          valuePath: $.full.dash0AuthHeader
                        - name: Dash0-Dataset
                          valuePath: $.full.cfg.Items[0].Attributes.Dash0Dataset
                      onHttpError: Throw
                      retry:
                        maxAttempts: 3
                      targetPath: $.key.otlpResponse

            # ================================================================
            # Heartbeat, UNCONDITIONAL (AB#5429, convention from AB#5426).
            #
            # Every metric above is named for a fault and emitted only when the fault occurs, so
            # a tenant with nothing wrong produces nothing at all - and so does a monitor that
            # has stopped. On 2026-09-29 the CK health monitor was silent for four hours and no
            # rule could tell the difference. This node is the difference.
            #
            # Last node before the execution result, so its presence means the run REACHED the
            # end. Every failure path above is contained in a continueOnError ForEach precisely
            # so that nothing between the trigger and here can suppress the pulse except the
            # monitor actually dying.
            #
            # It says "the monitor completed a pass over this tenant" - NOT "this tenant is
            # healthy". A tenant with three NotInstalled findings heartbeats too.
            #
            # Self-arming for a dead-man's switch: a tenant that was never monitored has no
            # series and cannot fire, and a tenant where this blueprint is deliberately
            # uninstalled ages out instead of alerting forever. The rule form is presence over a
            # long window without presence over a short one.
            # ================================================================
            - type: WriteJson@1
              description: OTLP/HTTP metrics envelope, run heartbeat
              jsonString: |
                {"resourceMetrics":[{"resource":{"attributes":[
                  {"key":"service.name","value":{"stringValue":"octo-blueprint-health-monitor"}}]},
                 "scopeMetrics":[{"scope":{"name":"Monitoring.BlueprintHealth","version":"1.0.0"},
                  "metrics":[{"name":"octo.blueprint.monitor.heartbeat","unit":"{run}",
                   "description":"1 = the blueprint-health-check pipeline completed a run for this tenant",
                   "gauge":{"dataPoints":[{"timeUnixNano":"","asInt":"1","attributes":[
                     {"key":"octo.tenant.id","value":{"stringValue":""}}]}]}}]}]}]}
              targetPath: $.heartbeat
            - type: SetPrimitiveValue@1
              valuePath: $.nowUnixNano
              valueType: String
              targetPath: $.heartbeat.resourceMetrics[0].scopeMetrics[0].metrics[0].gauge.dataPoints[0].timeUnixNano
            - type: SetPrimitiveValue@1
              valuePath: $.cfg.Items[0].Attributes.TenantId
              valueType: String
              targetPath: $.heartbeat.resourceMetrics[0].scopeMetrics[0].metrics[0].gauge.dataPoints[0].attributes[0].value.stringValue
            - type: MakeHttpRequest@1
              description: Push the heartbeat to Dash0
              method: POST
              urlPath: $.otlpUrl
              bodyPath: $.heartbeat
              bodyContentType: application/json
              headerParameters:
                - name: Authorization
                  valuePath: $.dash0AuthHeader
                - name: Dash0-Dataset
                  valuePath: $.cfg.Items[0].Attributes.Dash0Dataset
              onHttpError: Throw
              retry:
                maxAttempts: 3
              targetPath: $.heartbeatResponse
            - type: SetPipelineExecutionResult@1
              description: >-
                Persist both per-item error lists as the execution output. The HTTP calls that can
                realistically fail run with LogAndStop and therefore never land here; what does is
                an unreachable Dash0 ingress or a repository read that threw, which is exactly
                what one wants to see on the execution when the heartbeat is missing.
              path: $.runErrors

  # --- PipelineTrigger (hourly at :20) ---
  #
  # Offset from Monitoring.CkHealth's :05 so a tenant hosting both does not fire two monitors,
  # two token bursts and two OTLP pushes in the same minute.
  - rtId: '0c4eb1000000000000000003'
    ckTypeId: System.Communication/PipelineTrigger-1
    associations:
      - roleId: System/ParentChild-1
        targetRtId: '0c4eb1000000000000000001'
        targetCkTypeId: System.Communication/DataFlow-1
      - roleId: System.Communication/Triggers-1
        targetRtId: '0c4eb1000000000000000002'
        targetCkTypeId: System.Communication/Pipeline-1
    attributes:
      - id: System/Name-1
        value: Blueprint Health Check Hourly
      - id: System/Description-1
        value: Triggers the blueprint-health-check pipeline once per hour.
      - id: System/Enabled-1
        value: true
      - id: System.Bot/CronExpression-1
        value: "0 20 * * * ?"
