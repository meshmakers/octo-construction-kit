$schema: https://schemas.meshmakers.cloud/runtime-model.schema.json
dependencies:
- Monitoring-[2.1,3.0)
entities:
  # --- Monitor configuration (edit after install; not blueprint-locked) ---
  #
  # TenantId is NOT a placeholder: ${octo.tenantId} is substituted by
  # BlueprintVariableInterpolator at apply time, so the entity already knows which tenant it
  # is in. That matters because a pipeline has no other way to find out - no node exposes the
  # ambient tenant id to the DataContext, and every metric emitted here needs octo.tenant.id.
  - rtId: '0c4eb1000000000000000004'
    ckTypeId: Monitoring/BlueprintHealthMonitorConfig-1
    attributes:
      - id: System/Name-1
        value: Blueprint Health Monitor Configuration
      - id: System/RtBlueprintLocked-1
        value: false
      - id: Monitoring/TenantId-1
        value: '${octo.tenantId}'
      - id: Monitoring/TokenUrl-1
        value: https://CHANGE-ME-identity.example.com/connect/token
      - id: Monitoring/AssetServicesBaseUrl-1
        value: https://CHANGE-ME-asset.example.com
      - id: Monitoring/ClientId-1
        value: CHANGE-ME-client-id
      - id: Monitoring/ClientSecret-1
        value: CHANGE-ME-client-secret
      - id: Monitoring/Scope-1
        value: octo_api
      - id: Monitoring/Dash0IngressUrl-1
        value: https://CHANGE-ME-ingress.europe-west4.gcp.dash0.com
      - id: Monitoring/Dash0AuthToken-1
        value: CHANGE-ME-dash0-auth-token
      - id: Monitoring/Dash0Dataset-1
        value: CHANGE-ME-dataset

  # No ExpectedBlueprint entity is seeded, on purpose.
  #
  # Monitoring.CkHealth seeds a "Monitored Tenant CHANGE-ME" example and that example fires
  # CkHealthTenantUnreachable every hour until someone edits it. The same shape here would fire
  # NotInstalled every hour on every fresh install, which trains people to ignore the alert that
  # matters most. An empty list simply disables the NotInstalled check; drift monitoring and the
  # heartbeat work with no further configuration.
  #
  # Add entities of type Monitoring/ExpectedBlueprint-1 with attribute Monitoring/BlueprintName-1
  # (the blueprint name WITHOUT the version suffix), and keep them in version control as an
  # ImportRt file - they live only in this tenant's database and a Clean or restore loses them.
