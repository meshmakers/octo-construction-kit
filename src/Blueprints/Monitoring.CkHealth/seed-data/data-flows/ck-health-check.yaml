$schema: https://schemas.meshmakers.cloud/runtime-model.schema.json
dependencies:
- System.Communication-[3.1,4.0)
- Monitoring-[2.0,3.0)
entities:
  # ==========================================================================
  # CK Health Monitoring
  #
  # Hourly cron pipeline: acquires a client-credentials token, queries
  # {tenantId}/v1/Models/LibraryStatus for every MonitoredTenant and reports the
  # result to Dash0 as OTLP metrics. Runs on the Mesh Adapter that
  # System.Communication seeds (rtId 670000000000000000000002).
  #
  # Why Dash0 rather than a Teams webhook of its own: alerting then lives in one
  # place. The same notification channels, the same card that flips from FIRING to
  # RESOLVED when the model is fixed, the same silencing - instead of a second,
  # parallel alerting path that nobody remembers to look at.
  #
  # Two metrics are emitted:
  #   octo.ck.library.state    per tenant+library, 1 = catalog inconsistency,
  #                            2 = ResolveFailed. Healthy libraries are NOT emitted:
  #                            a check rule on "> 0" then has nothing to fire on, and
  #                            the series simply ages out once the model is repaired.
  #   octo.ck.tenant.unreachable 1 when a tenant's LibraryStatus could not be read at
  #                            all. No tenant label - see the comment at that node.
  # Attribute keys arrive as PromQL labels with dots turned into underscores
  # (octo.tenant.id -> octo_tenant_id); verified against test-2 on 2026-09-29.
  # ==========================================================================

  # --- DataFlow ---
  - rtId: '0c4ea1000000000000000001'
    ckTypeId: System.Communication/DataFlow-1
    attributes:
      - id: System/Name-1
        value: CK Health Monitoring
      - id: System/Description-1
        value: Scheduled check of CK model library health across tenants, reported to Dash0 as OTLP metrics.

  # --- Pipeline ---
  - rtId: '0c4ea1000000000000000002'
    ckTypeId: System.Communication/Pipeline-1
    associations:
      - roleId: System/ParentChild-1
        targetRtId: '0c4ea1000000000000000001'
        targetCkTypeId: System.Communication/DataFlow-1
      - roleId: System.Communication/Executes-1
        targetRtId: '670000000000000000000002'
        targetCkTypeId: System.Communication/Adapter-1
    attributes:
      - id: System/Name-1
        value: ck-health-check
      - id: System/Description-1
        value: Queries LibraryStatus of every monitored tenant and emits octo.ck.library.state / octo.ck.tenant.unreachable to Dash0.
      - id: System/Enabled-1
        value: true
      - id: System.Communication/DeploymentState-1
        value: 0
      - id: System.Communication/PipelineDefinition-1
        value: |
          triggers:
            - type: FromPipelineTriggerEvent@1
            - type: FromExecutePipelineCommand@1
          transformations:
            - type: GetRtEntitiesByType@1
              description: Load monitor configuration
              ckTypeId: Monitoring/CkHealthMonitorConfig
              targetPath: $.cfg
            - type: ExecuteCSharp@1
              description: >-
                OTLP wants nanoseconds since the Unix epoch. DateTime@1 offers Now but has no
                conversion in that direction (only FromUnixTimeMilliseconds, the other way round),
                so a one-line script is the only way to produce the field. Emitted as a string
                because that is what the OTLP JSON encoding expects.
              code: "return (DateTimeOffset.UtcNow.ToUnixTimeMilliseconds() * 1000000L).ToString();"
              returnType: String
              targetPath: $.nowUnixNano
            - type: FormatString@1
              description: Dash0 OTLP/HTTP metrics endpoint; the configured value carries no path
              format: "{$.cfg.Items[0].Attributes.Dash0IngressUrl}/v1/metrics"
              targetPath: $.otlpUrl
            - type: FormatString@1
              description: Build the Dash0 Authorization header value
              format: "Bearer {$.cfg.Items[0].Attributes.Dash0AuthToken}"
              targetPath: $.dash0AuthHeader
            - type: GetRtEntitiesByType@1
              description: Load monitored tenants
              ckTypeId: Monitoring/MonitoredTenant
              targetPath: $.tenants
            - type: ForEach@1
              description: Check every monitored tenant
              path: $
              iterationPath: $.tenants.Items
              targetPath: $.checkedTenants
              errorsPath: $.tenantErrors
              continueOnError: true
              maxDegreeOfParallelism: 1
              transformations:
                # One token PER TENANT, not one for the run. A client-credentials token is
                # bound to exactly one tenant: TenantAuthorizationMiddleware matches the route
                # tenant against the token's `tenant_id` claim, and the old assumption that such
                # a token may address any tenant died with AB#5032 (the hole) and AB#5077
                # (Enforce by default). `allowed_tenants` is explicitly NOT consulted on the
                # service-token path - it is a tenant-SELECTION hint, not an authorization.
                #
                # The way through is the one the ci-deploy workload pipelines already take:
                # the client is MIRRORED into every child tenant (AutoProvisionInChildTenants),
                # and `acr_values=tenant:{tenantId}` on /connect/token picks which mirror the
                # token is minted for. OidcTenantResolutionMiddleware reads it, the client is
                # loaded from that tenant's database, and ClientCredentialsTenantProcessor
                # stamps tenant_id={tenantId} - so the exact match downstream succeeds without
                # any cross-tenant exemption. Measured on test-2 2026-09-29: without acr_values
                # every foreign tenant answers 403, with it 200.
                #
                # Do not hoist this back out of the loop. One token for all tenants can only be
                # made to work by listing the client in CrossTenantServiceClientIds, which the
                # platform documents as a permanent hole.
                - type: FormatString@1
                  description: Tenant selector for the token request
                  format: "tenant:{$.key.Attributes.TenantId}"
                  targetPath: $.key.acrValues
                - type: WriteJson@1
                  description: Token request body (client_credentials)
                  jsonString: '{"grant_type":"client_credentials"}'
                  targetPath: $.key.tokenRequest
                - type: SetPrimitiveValue@1
                  valuePath: $.full.cfg.Items[0].Attributes.ClientId
                  valueType: String
                  targetPath: $.key.tokenRequest.client_id
                - type: SetPrimitiveValue@1
                  valuePath: $.full.cfg.Items[0].Attributes.ClientSecret
                  valueType: String
                  targetPath: $.key.tokenRequest.client_secret
                - type: SetPrimitiveValue@1
                  valuePath: $.full.cfg.Items[0].Attributes.Scope
                  valueType: String
                  targetPath: $.key.tokenRequest.scope
                - type: SetPrimitiveValue@1
                  valuePath: $.key.acrValues
                  valueType: String
                  targetPath: $.key.tokenRequest.acr_values
                - type: MakeHttpRequest@1
                  description: >-
                    Acquire an access token FOR THIS TENANT. LogAndStop for the same reason as
                    the LibraryStatus call below: the node returns without running the rest of
                    this iteration, so the tenant is still collected into $.checkedTenants
                    without a `status` and the second pass reports it by name. A tenant whose
                    mirror is missing or whose secret no longer matches therefore shows up as
                    unreachable instead of killing the whole run, which is what a single
                    pre-loop token with onHttpError Throw used to do.
                  method: POST
                  urlPath: $.full.cfg.Items[0].Attributes.TokenUrl
                  bodyPath: $.key.tokenRequest
                  bodyContentType: application/x-www-form-urlencoded
                  onHttpError: LogAndStop
                  retry:
                    maxAttempts: 3
                  targetPath: $.key.token
                - type: FormatString@1
                  description: Build Authorization header value for this tenant
                  format: "Bearer {$.key.token.access_token}"
                  targetPath: $.key.authHeader
                - type: FormatString@1
                  description: Build LibraryStatus URL
                  format: "{$.full.cfg.Items[0].Attributes.AssetServicesBaseUrl}/{$.key.Attributes.TenantId}/v1/Models/LibraryStatus"
                  targetPath: $.key.statusUrl
                - type: MakeHttpRequest@1
                  description: >-
                    Query CK model library status. LogAndStop rather than Throw, deliberately:
                    the node then logs the failure and returns WITHOUT running the rest of this
                    iteration, so no exception escapes and the tenant is still collected into
                    $.checkedTenants - just without a `status`. That is what lets the second pass
                    below name the tenant. With Throw the iteration aborts and ForEach records
                    only {index, errorType, message}, so the tenant would be unrecoverable.
                  method: GET
                  urlPath: $.key.statusUrl
                  headerParameters:
                    - name: Authorization
                      valuePath: $.key.authHeader
                  onHttpError: LogAndStop
                  retry:
                    maxAttempts: 3
                  targetPath: $.key.status
                - type: ForEach@1
                  description: Evaluate every model of the tenant
                  path: $
                  iterationPath: $.key.status.items
                  targetPath: $.key.evaluated
                  maxDegreeOfParallelism: 1
                  transformations:
                    - type: If@1
                      description: Only installed models are relevant
                      path: $.key.installedVersion
                      operator: NotEquals
                      valueType: String
                      transformations:
                        # The two failure kinds share one metric and differ only in its value, so
                        # the severity decision lives in the check rule rather than being split
                        # across two near-identical emit blocks. State is set to the empty string
                        # first: a library that is fine must emit nothing at all, otherwise a rule
                        # on "> 0" would need to know about healthy series.
                        - type: SetPrimitiveValue@1
                          description: No finding yet
                          value: ""
                          valueType: String
                          targetPath: $.key.ckState
                        - type: If@1
                          description: A catalog inconsistency is a warning - the model cannot be (re)installed as pinned
                          path: $.key.hasCatalogInconsistency
                          operator: Equals
                          value: true
                          valueType: Boolean
                          transformations:
                            - type: SetPrimitiveValue@1
                              value: CatalogInconsistency
                              valueType: String
                              targetPath: $.key.ckState
                            - type: SetPrimitiveValue@1
                              value: 1
                              valueType: Int
                              targetPath: $.key.ckStateValue
                        - type: If@1
                          description: >-
                            ResolveFailed is the serious one and deliberately checked last so it
                            wins over an inconsistency on the same library: the types are not
                            loaded, so every dependent pipeline fails on every execution.
                          path: $.key.modelState
                          operator: Equals
                          value: ResolveFailed
                          valueType: String
                          transformations:
                            - type: SetPrimitiveValue@1
                              value: ResolveFailed
                              valueType: String
                              targetPath: $.key.ckState
                            - type: SetPrimitiveValue@1
                              value: 2
                              valueType: Int
                              targetPath: $.key.ckStateValue
                        - type: If@1
                          description: Emit only when one of the two branches above found something
                          path: $.key.ckState
                          operator: NotEquals
                          value: ""
                          valueType: String
                          transformations:
                            # A dynamic JSON body has to be assembled as an OBJECT: MakeHttpRequest
                            # serialises whatever BodyPath points at, so a pre-formatted JSON string
                            # would be sent as a quoted string. The skeleton therefore carries the
                            # full OTLP shape and the leaves are filled in below.
                            - type: WriteJson@1
                              description: OTLP/HTTP metrics envelope for one gauge data point
                              jsonString: |
                                {"resourceMetrics":[{"resource":{"attributes":[
                                  {"key":"service.name","value":{"stringValue":"octo-ck-health-monitor"}}]},
                                 "scopeMetrics":[{"scope":{"name":"Monitoring.CkHealth","version":"2.1.0"},
                                  "metrics":[{"name":"octo.ck.library.state","unit":"{state}",
                                   "description":"1 = catalog inconsistency, 2 = ResolveFailed",
                                   "gauge":{"dataPoints":[{"timeUnixNano":"","asInt":"0","attributes":[
                                     {"key":"octo.tenant.id","value":{"stringValue":""}},
                                     {"key":"octo.ck.library","value":{"stringValue":""}},
                                     {"key":"octo.ck.version","value":{"stringValue":""}},
                                     {"key":"octo.ck.state","value":{"stringValue":""}}]}]}}]}]}]}
                              targetPath: $.key.otlp
                            - type: SetPrimitiveValue@1
                              valuePath: $.full.full.nowUnixNano
                              valueType: String
                              targetPath: $.key.otlp.resourceMetrics[0].scopeMetrics[0].metrics[0].gauge.dataPoints[0].timeUnixNano
                            - type: SetPrimitiveValue@1
                              valuePath: $.key.ckStateValue
                              valueType: String
                              targetPath: $.key.otlp.resourceMetrics[0].scopeMetrics[0].metrics[0].gauge.dataPoints[0].asInt
                            - type: SetPrimitiveValue@1
                              valuePath: $.full.key.Attributes.TenantId
                              valueType: String
                              targetPath: $.key.otlp.resourceMetrics[0].scopeMetrics[0].metrics[0].gauge.dataPoints[0].attributes[0].value.stringValue
                            - type: SetPrimitiveValue@1
                              valuePath: $.key.name
                              valueType: String
                              targetPath: $.key.otlp.resourceMetrics[0].scopeMetrics[0].metrics[0].gauge.dataPoints[0].attributes[1].value.stringValue
                            - type: SetPrimitiveValue@1
                              valuePath: $.key.installedVersion
                              valueType: String
                              targetPath: $.key.otlp.resourceMetrics[0].scopeMetrics[0].metrics[0].gauge.dataPoints[0].attributes[2].value.stringValue
                            - type: SetPrimitiveValue@1
                              valuePath: $.key.ckState
                              valueType: String
                              targetPath: $.key.otlp.resourceMetrics[0].scopeMetrics[0].metrics[0].gauge.dataPoints[0].attributes[3].value.stringValue
                            - type: MakeHttpRequest@1
                              description: >-
                                Push to Dash0. Throw on error: a monitor that silently fails to
                                report is worse than one that fails loudly, and the surrounding
                                ForEach records the error per tenant.
                              method: POST
                              urlPath: $.full.full.otlpUrl
                              bodyPath: $.key.otlp
                              bodyContentType: application/json
                              headerParameters:
                                - name: Authorization
                                  valuePath: $.full.full.dash0AuthHeader
                                - name: Dash0-Dataset
                                  valuePath: $.full.full.cfg.Items[0].Attributes.Dash0Dataset
                              onHttpError: Throw
                              retry:
                                maxAttempts: 3
                              targetPath: $.key.otlpResponse
            - type: ForEach@1
              description: >-
                Second pass over the tenants that were checked, to report the ones that could not
                be read. It iterates $.checkedTenants rather than the error list because the
                collected item still carries the tenant, while a ForEach error entry carries only
                {index, errorType, message} - which is why the first attempt at this could not name
                the tenant.
              path: $
              iterationPath: $.checkedTenants
              targetPath: $.tenantErrorAlerts
              maxDegreeOfParallelism: 1
              transformations:
                # A tenant whose check failed is reported separately from the library findings:
                # conflating the two would let a dead tenant read as a healthy one with no broken
                # models. The metric is named for the fault and emitted only when it occurs, value
                # 1, the same shape as octo.ck.library.state - so a rule alerts on "> 0", the
                # series ages out by itself, and no all-clear value exists anywhere to get wrong.
                # A "reachable" gauge holding 0 with a threshold of 0 does work (measured on
                # test-2: it fired about three minutes after the metric appeared); this shape was
                # chosen for consistency across the metrics, not because zero thresholds fail.
                #
                # octo.tenant.id IS emitted here, and getting it there is what decides the
                # shape of the whole pipeline. ForEach@1 records an iteration failure as
                # {index, errorType, message} only - the failing item itself is not carried over
                # (see ForEachNode.BuildIterationErrors), so a tenant whose check THREW would be
                # unnameable. That is why both risky calls in the first pass run with
                # onHttpError LogAndStop: the node returns without calling next(), nothing is
                # thrown, the iteration is not aborted, and the item is still collected - just
                # without a `status`. This second pass then has the whole tenant in scope.
                # The price is that the error text stays in the adapter log instead of
                # travelling on the metric; the tenant is what one needs to decide whether it
                # matters, and $.tenantErrors is still persisted by
                # SetPipelineExecutionResult for the rest.
                # A missing `status` is the signal. If@1 reads an absent path as null and does
                # not throw, and Equals with no value compares null against null, so this is the
                # idiomatic "is not set" gate. A tenant that answered has an object here and
                # falls through.
                - type: If@1
                  description: Only tenants whose LibraryStatus never arrived
                  path: $.key.status
                  operator: Equals
                  transformations:
                    - type: WriteJson@1
                      description: OTLP/HTTP metrics envelope, tenant-unreachable gauge
                      jsonString: |
                        {"resourceMetrics":[{"resource":{"attributes":[
                          {"key":"service.name","value":{"stringValue":"octo-ck-health-monitor"}}]},
                         "scopeMetrics":[{"scope":{"name":"Monitoring.CkHealth","version":"2.1.0"},
                          "metrics":[{"name":"octo.ck.tenant.unreachable","unit":"{state}",
                           "description":"1 = a monitored tenant's LibraryStatus could not be read",
                           "gauge":{"dataPoints":[{"timeUnixNano":"","asInt":"1","attributes":[
                             {"key":"octo.tenant.id","value":{"stringValue":""}}]}]}}]}]}]}
                      targetPath: $.key.otlp
                    - type: SetPrimitiveValue@1
                      valuePath: $.full.nowUnixNano
                      valueType: String
                      targetPath: $.key.otlp.resourceMetrics[0].scopeMetrics[0].metrics[0].gauge.dataPoints[0].timeUnixNano
                    - type: SetPrimitiveValue@1
                      valuePath: $.key.Attributes.TenantId
                      valueType: String
                      targetPath: $.key.otlp.resourceMetrics[0].scopeMetrics[0].metrics[0].gauge.dataPoints[0].attributes[0].value.stringValue
                    - type: MakeHttpRequest@1
                      description: Push the unreachable-tenant finding to Dash0
                      method: POST
                      urlPath: $.full.otlpUrl
                      bodyPath: $.key.otlp
                      bodyContentType: application/json
                      headerParameters:
                        - name: Authorization
                          valuePath: $.full.dash0AuthHeader
                        - name: Dash0-Dataset
                          valuePath: $.full.cfg.Items[0].Attributes.Dash0Dataset
                      onHttpError: Throw
                      retry:
                        maxAttempts: 3
                      targetPath: $.key.otlpResponse
            - type: SetPipelineExecutionResult@1
              description: Persist the per-tenant errors as the execution output
              path: $.tenantErrors

  # --- PipelineTrigger (hourly at :05) ---
  - rtId: '0c4ea1000000000000000003'
    ckTypeId: System.Communication/PipelineTrigger-1
    associations:
      - roleId: System/ParentChild-1
        targetRtId: '0c4ea1000000000000000001'
        targetCkTypeId: System.Communication/DataFlow-1
      - roleId: System.Communication/Triggers-1
        targetRtId: '0c4ea1000000000000000002'
        targetCkTypeId: System.Communication/Pipeline-1
    attributes:
      - id: System/Name-1
        value: CK Health Check Hourly
      - id: System/Description-1
        value: Triggers the ck-health-check pipeline once per hour.
      - id: System/Enabled-1
        value: true
      - id: System.Bot/CronExpression-1
        value: "0 5 * * * ?"
