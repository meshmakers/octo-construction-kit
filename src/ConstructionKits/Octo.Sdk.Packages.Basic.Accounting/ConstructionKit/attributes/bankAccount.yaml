$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
attributes:
  - id: AccountNumber
    valueType: String
    ownership: SeedOwned
    description: "Bank-specific account number"
  - id: BankAccountType
    valueType: Enum
    valueCkEnumId: ${this}/BankAccountType
    ownership: SeedOwned
    description: "Type of the bank account"
  - id: SettlementCreditorId
    valueType: String
    ownership: TenantOwned
    description: "Credit card accounts only: SEPA creditor identifier the card issuer uses to collect the monthly settlement from another own account (e.g. AT..ZZZ...). A debit with this creditor id is a transfer between own accounts. Empty = not used for recognition"
  - id: SettlementMandateReference
    valueType: String
    ownership: TenantOwned
    description: "Credit card accounts only: SEPA mandate reference of the settlement direct debit. A debit with this mandate reference is a transfer between own accounts. Empty = not used for recognition"
  - id: SettlementNamePattern
    valueType: String
    ownership: TenantOwned
    description: "Credit card accounts only: case-insensitive text that the counterpart name or the purpose of the settlement debit contains (e.g. PAYLIFE). Fallback when the import carries no creditor id or mandate reference. Empty = not used for recognition"
  - id: Balance
    valueType: Double
    ownership: SeedOwned
    description: "Current balance of the account"
  - id: Currency
    valueType: String
    ownership: SeedOwned
    description: "ISO 4217 currency code (e.g. EUR, USD)"
  - id: BalanceDate
    valueType: DateTime
    ownership: SeedOwned
    description: "Date of the last balance update"
  - id: Overdraft
    valueType: Double
    ownership: SeedOwned
    description: "Overdraft limit of the account"
  - id: AvailableFunds
    valueType: Double
    ownership: SeedOwned
    description: "Available funds on the account"
  - id: BankAccountExternalId
    valueType: String
    ownership: SeedOwned
    description: "Identifier of the account in the external system (e.g. finAPI account ID)"
  - id: BankAccountClosedAt
    valueType: DateTime
    ownership: TenantOwned
    description: "Date the account was closed at the bank. Set by the user; a closed account keeps its transactions and matches but is no longer synchronized and raises no warnings. Empty while the account is open"
