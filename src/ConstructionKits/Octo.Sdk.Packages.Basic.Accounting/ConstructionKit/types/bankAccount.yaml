$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
types:
- typeId: BankAccount
  derivedFromCkTypeId: ${Basic}/NamedEntity
  description: "A bank account with balance and account details"
  attributes:
    # Optional since 1.4.0: credit-card and PayPal accounts have no IBAN.
    - id: ${Basic}/Iban
      name: Iban
      isOptional: true
    - id: ${Basic}/BankName
      name: BankName
      isOptional: true
    - id: ${Basic}/AccountHolder
      name: AccountHolder
      isOptional: true
    - id: ${this}/AccountNumber
      name: AccountNumber
      isOptional: true
    - id: ${this}/BankAccountType
      name: AccountType
      isOptional: true
    - id: ${this}/Balance
      name: Balance
      isOptional: true
    - id: ${this}/Currency
      name: Currency
    - id: ${this}/BalanceDate
      name: BalanceDate
      isOptional: true
    - id: ${this}/Overdraft
      name: Overdraft
      isOptional: true
    - id: ${this}/AvailableFunds
      name: AvailableFunds
      isOptional: true
    - id: ${this}/BankAccountExternalId
      name: ExternalId
      isOptional: true
  # No unique IBAN index since 1.4.0 — IBAN is optional (credit card / PayPal)
  # and multiple IBAN-less accounts would collide on a unique index. Sync
  # pipelines deduplicate via ExternalId lookups instead.
  indexes:
    - indexType: Ascending
      fields:
        - attributePaths:
            - Iban
    - indexType: Ascending
      fields:
        - attributePaths:
            - ExternalId
