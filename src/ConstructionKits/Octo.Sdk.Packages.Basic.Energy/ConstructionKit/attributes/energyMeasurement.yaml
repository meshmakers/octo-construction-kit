$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
attributes:
  - id: DataQuality
    valueType: Enum
    valueCkEnumId: ${this}/DataQuality
    ownership: SeedOwned
    description: "The quality of the received data"
  - id: ObisCode
    valueType: String
    ownership: SeedOwned
    description: "The OBIS code associated with the energy measurement"
  - id: SourceDocumentDate
    valueType: DateTime
    ownership: SeedOwned
    description: "Creation timestamp of the source document this measurement was read from — for an EDA consumption record the routing header's DocumentCreationDateTime. It is the document's OWN timestamp, never the time it was ingested, so replaying the same source produces the same value. Its purpose is to order two deliveries that cover the same window: a correction carries a later value than the message it corrects, and a re-send of an old message carries its original. Declare it as a key of an archive's ConflictPrecedence and the archive keeps the newer of two competing writes for the same window regardless of arrival order; leave the archive's precedence empty and the last writer wins. For metering data it belongs BEHIND DataQuality rather than alone: ordering by document date only lets a later estimate overwrite an earlier measurement."
