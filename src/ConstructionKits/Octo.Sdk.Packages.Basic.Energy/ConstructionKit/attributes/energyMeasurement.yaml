$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
attributes:
  - id: DataQuality
    valueType: Enum
    valueCkEnumId: ${this}/DataQuality
    description: "The quality of the received data"
  - id: ObisCode
    valueType: String
    description: "The OBIS code associated with the energy measurement"
  - id: SourceDocumentDate
    valueType: DateTime
    description: "Creation timestamp of the source document this measurement was read from — for an EDA consumption record the routing header's DocumentCreationDateTime. It is the document's OWN timestamp, never the time it was ingested, so replaying the same source produces the same value. Its purpose is to order two deliveries that cover the same window: a correction carries a later value than the message it corrects, and a re-send of an old message carries its original. Name it as a TimeRangeArchive's ConflictVersionColumn and the archive keeps the newer of two competing writes regardless of arrival order; leave it unset and the last writer wins."
