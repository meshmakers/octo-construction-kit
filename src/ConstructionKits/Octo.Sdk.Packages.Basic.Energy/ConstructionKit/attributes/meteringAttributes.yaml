$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
attributes:
  - id: MeteringPointNumber
    valueType: String
    description: "Number identifying the metering point"
  - id: PartitionFactor
    valueType: Int
    description: "Partition factor of the metering point within an energy community (percentage share, EDA process EC_PRTFACT_CHANGE)"
  - id: IsProducer
    valueType: Boolean
    description: "Indicates if the new metering point is a producer"
  - id: CarrierType
    valueType: Enum
    valueCkEnumId: ${this}/CarrierType
    description: "Type of energy carrier (e.g., electricity, gas)"
  - id: NotificationContactEmail
    valueType: String
    description: "Email address for notifications related to the metering point"
