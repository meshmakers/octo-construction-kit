$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
associationRoles:
  - id: AssignedBilling
    description: "A billing document or line item associated with data source."
    inboundName: Billing
    inboundMultiplicity: N
    outboundName: AssignedTo
    outboundMultiplicity: ZeroOrOne
  - id: BilledMeteringPoint
    description: "A metering point associated with a billing line item."
    inboundName: Billings
    inboundMultiplicity: N
    outboundName: MeteringPoint
    outboundMultiplicity: ZeroOrOne
  - id: AssociatedFacilities
    description: "The operating facilities associated with a customer. Optional: facilities may exist without a customer (data minimization for tenants without the Billing blueprint, AB#4718)."
    inboundName: Customer
    inboundMultiplicity: ZeroOrOne
    outboundName: Facilities
    outboundMultiplicity: N
  - id: ParticipationPeriod
    description: "Association between a metering point an a time range to get the participation period for a metering point"
    inboundName: Periods
    inboundMultiplicity: N
    outboundName: MeteringPoint
    outboundMultiplicity: One
