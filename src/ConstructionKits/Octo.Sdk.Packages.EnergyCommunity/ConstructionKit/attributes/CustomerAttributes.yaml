$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
attributes:
  - id: CustomerNumber
    valueType: String
    ownership: SeedOwned
    description: "Internal customer number"
  - id: BillingCycle
    valueType: Enum
    valueCkEnumId: ${this}/BillingCycle
    ownership: SeedOwned
    description: "Billing cycle associated with the customer"
    defaultValues:
      - 1
  - id: DateOfBirth
    valueType: DateTime
    ownership: SeedOwned
    description: "Date of birth of the customer (natural person)"
