$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
enums:
  - enumId: SimulationPreset
    description: "Community composition preset of the energy simulation (members, mix and sizes)"
    values:
      - key: 0
        name: Legacy
        description: "The historic demo community: 14 household consumers and 3 PV producers"
      - key: 1
        name: PvDorf
        description: "PV-heavy village: households, two small businesses, many rooftop PV systems (seller at noon)"
      - key: 2
        name: Gewerbepark
        description: "Business park: commercial load with large rooftop PV (buyer, high coverage)"
      - key: 3
        name: Landwirtschaft
        description: "Farming community: agricultural load profile, households and barn-roof PV (seller at noon)"
      - key: 4
        name: Stadtblock
        description: "City block: many small households and one small PV system (pure buyer)"
      - key: 5
        name: WasserkraftTal
        description: "Valley with a small run-of-river hydro plant (night-time seller; hydro profile from M3)"
  - enumId: MeteringDataSource
    description: "Origin of the metering values of a metering point"
    values:
      - key: 0
        name: Eda
        description: "Values come from the grid operator via EDA (default for productive metering points)"
      - key: 1
        name: Simulated
        description: "Values are generated by the energy simulation"
      - key: 2
        name: SelfReported
        description: "Values are reported by the participant itself (non-EDA meter)"
  - enumId: LoadProfile
    description: "Standard load profile used to shape the consumption of a consumer metering point"
    values:
      - key: 0
        name: H0
        description: "Household"
      - key: 1
        name: G0
        description: "Commercial, general"
      - key: 2
        name: L0
        description: "Agriculture, general"
      - key: 3
        name: HeatPump
        description: "Heat pump (simulation support planned)"
      - key: 4
        name: Ev
        description: "Electric vehicle charging (simulation support planned)"
  - enumId: SimulationNoiseLevel
    description: "Strength of the seeded random noise added to simulated values"
    values:
      - key: 0
        name: Off
        description: "No noise, deterministic profile values"
      - key: 1
        name: Low
        description: "Low noise"
      - key: 2
        name: Medium
        description: "Medium noise"
      - key: 3
        name: High
        description: "High noise"
  - enumId: SimulationWeatherMode
    description: "Daily weather model applied to simulated PV production"
    values:
      - key: 0
        name: ClearSky
        description: "Every day is a clear-sky day"
      - key: 1
        name: Mixed
        description: "Seeded mix of sunny, changeable and overcast days"
      - key: 2
        name: Variable
        description: "Mixed weather with bad-weather periods"
  - enumId: AllocationKey
    description: "Key used to allocate the community production to the participants per 15-minute slot"
    values:
      - key: 0
        name: Dynamic
        description: "Proportional to consumption, capped at the participant's own consumption"
      - key: 1
        name: Static
        description: "Fixed shares per participant"
  - enumId: SimulationResetMode
    description: "Mode of a simulation reset"
    values:
      - key: 0
        name: Values
        description: "Overwrite the simulated values in place; structure and self-reported values stay"
      - key: 1
        name: Full
        description: "Delete simulated master data and archives and rebuild everything"
  - enumId: SimulationResetState
    description: "Processing state of a simulation reset request"
    values:
      - key: 0
        name: Requested
        description: "The request waits for the reset runner"
      - key: 1
        name: Running
        description: "The reset is running"
      - key: 2
        name: Done
        description: "The reset finished successfully"
      - key: 3
        name: Rejected
        description: "The request was rejected (e.g. full reset not allowed any more)"
      - key: 4
        name: Failed
        description: "The reset failed; see the message"
