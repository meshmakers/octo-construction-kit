$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
types:
  - typeId: BillingDocumentLineItem
    derivedFromCkTypeId: ${System}/Entity
    description: "A billing document line item"
    attributes:
      - id: ${this}/GrossAmount
        name: GrossAmount
      - id: ${this}/NetAmount
        name: NetAmount
      - id: ${this}/TaxAmount
        name: TaxAmount
      - id: ${this}/TaxRate
        name: TaxRate
      - id: ${this}/UnitPrice
        name: UnitPrice
      - id: ${this}/BillingType
        name: BillingType
      - id: ${Basic}/Quantity
        name: Quantity
      - id: ${Basic}/TimeRange
        name: BilledTimeRange
        isOptional: true
      - id: ${this}/IntervalCount
        name: IntervalCount
        isOptional: true
      - id: ${this}/IntervalCountL1
        name: IntervalCountL1
        isOptional: true
      - id: ${this}/IntervalCountL2
        name: IntervalCountL2
        isOptional: true
      - id: ${this}/IntervalCountL3
        name: IntervalCountL3
        isOptional: true
      - id: ${this}/IntervalCountUnknown
        name: IntervalCountUnknown
        isOptional: true
    associations:
      - id: ${System}/ParentChild
        targetCkTypeId: ${this}/BillingDocument
      - id: ${this}/BilledMeteringPoint
        targetCkTypeId: ${Basic.Energy}/MeteringPoint
