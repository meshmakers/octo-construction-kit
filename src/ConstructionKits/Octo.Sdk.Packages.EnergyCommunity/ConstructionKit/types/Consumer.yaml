$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
types:
  - typeId: Consumer
    derivedFromCkTypeId: ${Basic.Energy}/Consumer
    description: "A consumer metering point participating in an energy community"
    attributes:
      - id: ${this}/PartitionFactor
        name: PartitionFactor
        isOptional: true
      - id: ${this}/EnergyConsumption
        name: EnergyConsumption
        isOptional: true
