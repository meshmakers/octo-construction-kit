$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
types:
  - typeId: Producer
    derivedFromCkTypeId: ${Basic.Energy}/Producer
    description: "A producer metering point participating in an energy community"
    attributes:
      - id: ${this}/PartitionFactor
        name: PartitionFactor
        isOptional: true
      - id: ${this}/EnergyProductionCapacity
        name: EnergyProductionCapacity
        isOptional: true
