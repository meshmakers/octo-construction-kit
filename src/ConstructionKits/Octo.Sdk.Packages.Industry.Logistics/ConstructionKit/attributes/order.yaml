$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
attributes:
- id: OrderNumber
  valueType: String
  ownership: SeedOwned
  description: "Primary order identifier"
- id: ExternalOrderNumber
  valueType: String
  ownership: SeedOwned
  description: "Reference number from the source system (shop/ERP)"
- id: OrderDate
  valueType: DateTime
  ownership: SeedOwned
- id: DeliveryDate
  valueType: DateTime
  ownership: SeedOwned
- id: OrderStatus
  valueType: Enum
  valueCkEnumId: ${this}/OrderStatus
  ownership: SeedOwned
- id: PositionNumber
  valueType: Int
  ownership: SeedOwned
- id: Currency
  valueType: String
  ownership: SeedOwned
  description: "ISO 4217 currency code of the order's amounts."
- id: NetAmount
  valueType: Double
  ownership: SeedOwned
  description: "Net amount: of the order on Order, of the LINE on OrderItem (unit prices derive from it)."
  metaData:
    - key: Decimals
      value: 2
- id: GrossAmount
  valueType: Double
  ownership: SeedOwned
  description: "Gross amount: of the order on Order, of the LINE on OrderItem."
  metaData:
    - key: Decimals
      value: 2
- id: ShippingMethod
  valueType: String
  ownership: SeedOwned
  description: "Shipping method as the source system identifies it (a method id or name); the fulfilment partner maps it to its carriers."
- id: Title
  valueType: String
  ownership: SeedOwned
  description: "Line text of an order item as the source system states it (article name, service, shipping cost)."
- id: TaxRate
  valueType: Double
  ownership: SeedOwned
  description: "VAT rate of a line in percent."
  metaData:
    - key: Unit
      value: "%"
- id: ItemKind
  valueType: Enum
  valueCkEnumId: ${this}/OrderItemKind
  ownership: SeedOwned
  description: "What a line is: an article, the shipping cost, something else."
  defaultValues:
    - 0
