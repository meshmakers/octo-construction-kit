$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
attributes:
- id: Zipcode
  valueType: String
  ownership: SeedOwned
  description: "Postal code as text - leading zeros and letters are part of it."
- id: AddressLine2
  valueType: String
  ownership: SeedOwned
  description: "Second address line as the source system states it."
- id: NameAddition
  valueType: String
  ownership: SeedOwned
  description: "Addition to the addressee's name as the source system states it."
- id: HouseNumber
  valueType: String
  ownership: SeedOwned
  description: "House number when the source system states it apart from the street; such a source writes only the street name into Street."
- id: ShipTo
  valueType: Record
  valueCkRecordId: ${this}/PostalAddress
  ownership: SeedOwned
  description: "Where the goods go."
- id: BillTo
  valueType: Record
  valueCkRecordId: ${this}/PostalAddress
  ownership: SeedOwned
  description: "Whom the invoice addresses."
