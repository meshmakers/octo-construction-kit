$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
attributes:
- id: ShipmentNumber
  valueType: String
  ownership: SeedOwned
  description: "Dispatch / forwarding number"
- id: ShipmentDate
  valueType: DateTime
  ownership: SeedOwned
  description: "Point in time the goods were shipped: on Shipment as the fulfilment partner reports it, on Order as the source system states it."
- id: TrackingNumber
  valueType: String
  ownership: SeedOwned
  description: "Parcel / tracking number"
- id: PackagingType
  valueType: String
  ownership: SeedOwned
- id: ServiceType
  valueType: String
  ownership: SeedOwned
- id: ParcelCount
  valueType: Int
  ownership: SeedOwned
- id: Carrier
  valueType: Enum
  valueCkEnumId: ${this}/Carrier
  ownership: SeedOwned
- id: Completeness
  valueType: Enum
  valueCkEnumId: ${this}/Completeness
  ownership: SeedOwned
- id: CarrierToken
  valueType: String
  ownership: SeedOwned
  description: "Carrier reference exactly as the delivering system states it, beside the Carrier enum: on Parcel as the fulfilment partner delivered it (for a shop system: its own carrier id), on Order as the source system identifies the shipping provider (e.g. its provider id)."
- id: TrackingUrl
  valueType: String
  ownership: SeedOwned
  description: "The carrier's tracking link when the partner delivered one."
