$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
# Generische Logistik-Enums. isExtensible -> Kunden/Projekte koennen Werte ergaenzen,
# ohne die Basis zu aendern. Quellspezifische Codes (z.B. DILOS 100/200/300) mappt der Adapter.
enums:
- enumId: Carrier
  useFlags: false
  isExtensible: true
  values:
  - key: 1
    name: DHL
  - key: 2
    name: UPS
  - key: 3
    name: GLS
  - key: 4
    name: DPD
  - key: 5
    name: Post
  - key: 6
    name: FedEx
  - key: 99
    name: Other
- enumId: ArticleType
  useFlags: false
  isExtensible: true
  values:
