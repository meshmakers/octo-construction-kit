$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
records:
- recordId: PostalAddress
  description: "Delivery or invoice address: company and/or person, street, postal code as text, city, country code, and the contact details a carrier advises to. A source that states the house number apart from the street writes the complete street line (street name, one blank, house number) into Street, exactly like a source with a combined street field, and the number alone into HouseNumber."
  attributes:
    - id: ${Basic}/CompanyName
      name: CompanyName
      isOptional: true
    - id: ${Basic}/FirstName
      name: FirstName
      isOptional: true
    - id: ${Basic}/LastName
      name: LastName
      isOptional: true
    - id: ${Basic}/AddressStreet
      name: Street
    - id: ${this}/Zipcode
      name: Zipcode
    - id: ${Basic}/AddressCityTown
      name: City
    - id: ${Basic}/AddressNationalCode
      name: CountryCode
    - id: ${Basic}/TelephoneNumber
      name: Phone
      isOptional: true
    - id: ${Basic}/EMailAddress
      name: Email
      isOptional: true
    - id: ${this}/AddressLine2
      name: Line2
      isOptional: true
    - id: ${this}/NameAddition
      name: NameAddition
      isOptional: true
    - id: ${this}/HouseNumber
      name: HouseNumber
      isOptional: true
