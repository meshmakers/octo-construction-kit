$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
# Generic logistics entities (reusable industry scaffold).
# Convention: transactional types -> ${System}/Entity; named master data -> ${Basic}/NamedEntity.
types:
- typeId: Customer
  derivedFromCkTypeId: ${Basic}/NamedEntity   # inherits Name + Description
  description: "A customer who places logistics/fulfillment orders."
  attributes:
  - id: ${this}/CustomerNumber
    name: CustomerNumber
  - id: ${Basic}/Contact                       # Contact record (CompanyName/First/LastName/Email/Address)
    name: Contact                              # full contact (company/person/email) instead of Address only
    isOptional: true

- typeId: Article
  derivedFromCkTypeId: ${Basic}/NamedEntity   # inherits Name + Description
  description: "An article / product master record."
  attributes:
  - id: ${this}/ArticleNumber
    name: ArticleNumber
  - id: ${this}/Ean
    name: Ean
    isOptional: true
  - id: ${this}/Weight
    name: Weight
    isOptional: true
  - id: ${this}/ArticleType
    name: ArticleType
    isOptional: true

- typeId: Order
  derivedFromCkTypeId: ${System}/Entity        # transactional (like Industry.Maintenance/order)
  description: "A logistics order placed by a customer for fulfillment."
  attributes:
  - id: ${this}/OrderNumber
    name: OrderNumber
  - id: ${this}/ExternalOrderNumber
    name: ExternalOrderNumber
    isOptional: true
  - id: ${this}/OrderDate
    name: OrderDate
    isOptional: true
  - id: ${this}/DeliveryDate
    name: DeliveryDate
    isOptional: true
  - id: ${this}/Carrier
    name: Carrier
    isOptional: true
  - id: ${this}/OrderStatus
    name: Status
    isOptional: true
  - id: ${Basic}/Address
    name: DeliveryAddress
    isOptional: true
  associations:
  - id: ${this}/OrderCustomer
    targetCkTypeId: ${this}/Customer

- typeId: OrderItem
  derivedFromCkTypeId: ${System}/Entity
  description: "A line item of a logistics order."
  attributes:
  - id: ${this}/PositionNumber
    name: PositionNumber
  - id: ${Basic}/Quantity
    name: Quantity
  - id: ${Basic}/Amount                        # Value + Unit (net unit price)
    name: UnitPriceNet
    isOptional: true
  associations:
  - id: ${this}/OrderItemOrder
    targetCkTypeId: ${this}/Order
  - id: ${this}/OrderItemArticle
    targetCkTypeId: ${this}/Article

- typeId: Shipment
  derivedFromCkTypeId: ${System}/Entity        # DILOS order feedback ("Auftragsrueckmeldung", AR) header
  description: "A dispatch / order feedback for an order; carries totals and completeness."
  attributes:
  - id: ${this}/ShipmentNumber
    name: ShipmentNumber
  - id: ${this}/ShipmentDate
    name: ShipmentDate
    isOptional: true
  - id: ${this}/Completeness
    name: Completeness
    isOptional: true
  - id: ${this}/ParcelCount
    name: ParcelCount
    isOptional: true
  - id: ${this}/Weight
    name: TotalWeight
    isOptional: true
  associations:
  - id: ${this}/ShipmentOrder
    targetCkTypeId: ${this}/Order

- typeId: Parcel
  derivedFromCkTypeId: ${System}/Entity        # AR parcel record (C*)
  description: "A parcel / colli within a shipment; carries tracking and carrier."
  attributes:
  - id: ${this}/TrackingNumber
    name: TrackingNumber
  - id: ${this}/Carrier
    name: Carrier
    isOptional: true
  - id: ${this}/PackagingType
    name: PackagingType
    isOptional: true
  - id: ${this}/ServiceType
    name: ServiceType
    isOptional: true
  - id: ${this}/Weight
    name: Weight
    isOptional: true
  associations:
  - id: ${this}/ParcelShipment
    targetCkTypeId: ${this}/Shipment

- typeId: ShipmentItem
  derivedFromCkTypeId: ${System}/Entity        # AR item / packing-list record (P*/L*)
  description: "A dispatched line within a shipment."
  attributes:
  - id: ${this}/PositionNumber
    name: PositionNumber
  # ${Basic}/Quantity can only be referenced once per type (attribute ids are unique),
  # so delivered/open quantities are deliberately dedicated attributes.
  - id: ${this}/DeliveredQuantity
    name: DeliveredQuantity
  - id: ${this}/OpenQuantity
    name: OpenQuantity                         # can be negative (over-delivery; -1 seen in the golden sample files)
    isOptional: true
  associations:
  - id: ${this}/ShipmentItemShipment
    targetCkTypeId: ${this}/Shipment
  - id: ${this}/ShipmentItemArticle
    targetCkTypeId: ${this}/Article
  - id: ${this}/ShipmentItemParcel
    targetCkTypeId: ${this}/Parcel

- typeId: Stock
  derivedFromCkTypeId: ${System}/Entity        # stock report (return path)
  description: "Stock level of an article (stock overview)."
  attributes:
  - id: ${Basic}/Quantity
    name: Quantity
  - id: ${this}/StockStatus
    name: Status
    isOptional: true
  associations:
  - id: ${this}/StockArticle
    targetCkTypeId: ${this}/Article
