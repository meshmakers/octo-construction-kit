$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
types:
- typeId: Article
  derivedFromCkTypeId: ${Basic}/NamedEntity   # inherits Name + Description
  description: "An article / product master record."
  indexes:
  # Not unique on purpose: a unique index on an existing type is a major change.
  - indexType: "Ascending"
    fields:
      - attributePaths:
        - Source
        - ArticleNumber
  attributes:
  - id: ${this}/Source
    name: Source
  - id: ${this}/ArticleNumber
    name: ArticleNumber
  - id: ${this}/Ean
    name: Ean
    isOptional: true
  - id: ${this}/Weight
    name: Weight
    isOptional: true
  - id: ${this}/ArticleType
    name: ArticleType
    isOptional: true
  - id: ${this}/ExternalArticleNumber
    name: ExternalArticleNumber
    isOptional: true
  - id: ${this}/Unit
    name: Unit
    isOptional: true
  - id: ${this}/PurchasePrice
    name: PurchasePrice
    isOptional: true
  - id: ${this}/Discontinued
    name: Discontinued
    isOptional: true
  - id: ${this}/Length
    name: Length
    isOptional: true
  - id: ${this}/Width
    name: Width
    isOptional: true
  - id: ${this}/Height
    name: Height
    isOptional: true
  - id: ${this}/CountryOfOrigin
    name: CountryOfOrigin
    isOptional: true
  - id: ${this}/CustomsTariffNumber
    name: CustomsTariffNumber
    isOptional: true
  - id: ${this}/UnitsPerItem
    name: UnitsPerItem
    isOptional: true
  - id: ${this}/DesiredStock
    name: DesiredStock
    isOptional: true
  - id: ${this}/Category1
    name: Category1
    isOptional: true
  - id: ${this}/Category2
    name: Category2
    isOptional: true
  - id: ${this}/SourceProductType
    name: SourceProductType
    isOptional: true
  - id: ${this}/VatIndex
    name: VatIndex
    isOptional: true
  - id: ${this}/TitleEnglish
    name: TitleEnglish
    isOptional: true
  - id: ${this}/BasicAttributes
    name: BasicAttributes
    isOptional: true
  - id: ${this}/BasicAttributesEnglish
    name: BasicAttributesEnglish
    isOptional: true
