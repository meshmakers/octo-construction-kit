$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
types:
- typeId: Customer
  derivedFromCkTypeId: ${Basic}/NamedEntity   # inherits Name + Description
  description: "A customer who places logistics/fulfillment orders."
  indexes:
  # Not unique on purpose: a unique index on an existing type is a major change.
  - indexType: "Ascending"
    fields:
      - attributePaths:
        - Source
        - CustomerNumber
  attributes:
  - id: ${this}/Source
    name: Source
  - id: ${this}/CustomerNumber
    name: CustomerNumber
  - id: ${Basic}/Contact                       # Contact record (CompanyName/First/LastName/Email/Address)
    name: Contact                              # full contact (company/person/email) instead of Address only
    isOptional: true
