$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
types:
- typeId: ExportRun
  derivedFromCkTypeId: ${System}/Entity        # outbound export/delivery log
  description: "One outbound export/delivery run of a dataset (e.g. article master), keyed by source, kind and calendar day. Doubles as the delivery-dedup marker: at most one delivery per source, kind and day."
  indexes:
  - indexType: "UniqueNotDeleted"
    fields:
      - attributePaths:
        - Source
        - ExportKind
        - ExportDay
  attributes:
  - id: ${this}/Source
    name: Source
  - id: ${this}/ExportKind
    name: ExportKind
  - id: ${this}/ExportDay
    name: ExportDay
