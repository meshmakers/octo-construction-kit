$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
types:
- typeId: Order
  derivedFromCkTypeId: ${System}/Entity        # transactional (like Industry.Maintenance/order)
  description: "A logistics order placed by a customer for fulfillment. Identified by Source and OrderNumber; TransferState records its handover to the fulfilment partner; Unknown means the order predates the handover state or its source does not use it (e.g. a source that writes the order only once it has delivered it, so the instance itself marks the export)."
  indexes:
  - indexType: "UniqueNotDeleted"
    fields:
      - attributePaths:
        - Source
        - OrderNumber
  - indexType: "Ascending"
    fields:
      - attributePaths:
        - Source
        - TransferState
  attributes:
  - id: ${this}/Source
    name: Source
  - id: ${this}/OrderNumber
    name: OrderNumber
  - id: ${this}/ExternalOrderNumber
    name: ExternalOrderNumber
    isOptional: true
  - id: ${this}/OrderDate
    name: OrderDate
    isOptional: true
  - id: ${this}/DeliveryDate
    name: DeliveryDate
    isOptional: true
  - id: ${this}/Carrier
    name: Carrier
    isOptional: true
  - id: ${this}/ShippingMethod
    name: ShippingMethod
    isOptional: true
  - id: ${this}/OrderStatus
    name: Status
    isOptional: true
  - id: ${this}/Currency
    name: Currency
    isOptional: true
  - id: ${this}/NetAmount
    name: NetAmount
    isOptional: true
  - id: ${this}/GrossAmount
    name: GrossAmount
    isOptional: true
  - id: ${this}/ShipTo
    name: ShipTo
    isOptional: true
  - id: ${this}/BillTo
    name: BillTo
    isOptional: true
  - id: ${this}/SourceVersion
    name: SourceVersion
    isOptional: true
  - id: ${this}/TransferState
    name: TransferState
    isOptional: true
  - id: ${this}/TransferredAt
    name: TransferredAt
    isOptional: true
  - id: ${this}/TransferError
    name: TransferError
    isOptional: true
  - id: ${this}/InvoiceNumber
    name: InvoiceNumber
    isOptional: true
  - id: ${Basic}/AddressVATnumber
    name: VatId
    isOptional: true
  - id: ${this}/Weight
    name: TotalWeight
    isOptional: true
  - id: ${this}/TaxRate
    name: TaxRate
    isOptional: true
  - id: ${this}/CarrierToken
    name: CarrierToken
    isOptional: true
  - id: ${this}/ShipmentDate
    name: ShipmentDate
    isOptional: true
  associations:
  - id: ${this}/OrderCustomer
    targetCkTypeId: ${this}/Customer
