$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
types:
- typeId: OrderItem
  derivedFromCkTypeId: ${System}/Entity
  description: "A line item of a logistics order: an article line, or the shipping cost as a line of its own (ItemKind). The article number as the source states it is kept on the line (ArticleNumber), so a line without an article link (an article the CK does not know) stays identifiable."
  attributes:
  - id: ${this}/ItemKind
    name: ItemKind
  - id: ${this}/PositionNumber
    name: PositionNumber
    isOptional: true
  - id: ${this}/ArticleNumber
    name: ArticleNumber
    isOptional: true
  - id: ${this}/Title
    name: Title
    isOptional: true
  - id: ${Basic}/Quantity
    name: Quantity
  - id: ${this}/NetAmount
    name: NetAmount
    isOptional: true
  - id: ${this}/GrossAmount
    name: GrossAmount
    isOptional: true
  - id: ${this}/TaxRate
    name: TaxRate
    isOptional: true
  - id: ${this}/Discount
    name: Discount
    isOptional: true
  - id: ${this}/SerialNumber
    name: SerialNumber
    isOptional: true
  associations:
  - id: ${this}/OrderItemOrder
    targetCkTypeId: ${this}/Order
  - id: ${this}/OrderItemArticle
    targetCkTypeId: ${this}/Article
