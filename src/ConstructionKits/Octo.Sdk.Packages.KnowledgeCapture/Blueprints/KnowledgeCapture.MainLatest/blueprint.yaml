$schema: https://schemas.meshmakers.cloud/blueprint-meta.schema.json
blueprintId: KnowledgeCapture.MainLatest-1.2.1
description: |
  GenAI-based knowledge capture seed for dev and test environments. Seeds the
  configuration entities (ServiceAccountConfiguration, McpConfiguration,
  AiConfiguration), the versioned prompt templates, and five pipelines:
  a generic source-artifact ingest endpoint (bronze), a PDF ingest via
  OCR (bronze), the structured
  generation pipeline with a verification pass (silver, GenerationMode
  Pipeline), the agentic generation pipeline with MCP retrieval tools
  (silver, GenerationMode Agentic), and the audience rendition pipeline
  (gold). Pipelines are seeded Undeployed; deploy them from Studio or via
  MCP deploy_pipeline. Before first use: set the ClientSecret on the
  wiki-capture-sa ServiceAccountConfiguration (register the OIDC client in
  octo-identity-services with scope octo_api - the adapter requests that scope
  and octo-mcp-service requires it) and the ApiKey on the
  wiki-capture-llm AiConfiguration. Requires System.Communication 4.0.0+
  (McpConfiguration type with AuthServiceAccountConfigurationName).
ckModelDependencies:
  - KnowledgeCapture-[1.2.1,2.0)
  - System.Communication-[4.0.0,5.0)

# One file per concern; the engine merges them into one model before importing, so order is cosmetic.
seedDataPaths:
  - seed-data/configurations.yaml
  - seed-data/data-flow.yaml
  - seed-data/prompt-templates.yaml
  - seed-data/pipelines/ingest.yaml
  - seed-data/pipelines/ingest-pdf.yaml
  - seed-data/pipelines/generate.yaml
  - seed-data/pipelines/generate-agentic.yaml
  - seed-data/pipelines/render.yaml

requires:
  octo.environment:
    - dev
    - test
