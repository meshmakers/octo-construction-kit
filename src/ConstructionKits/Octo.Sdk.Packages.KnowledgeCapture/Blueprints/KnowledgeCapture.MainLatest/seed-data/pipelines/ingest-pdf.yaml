$schema: https://schemas.meshmakers.cloud/runtime-model.schema.json
dependencies:
  - KnowledgeCapture-1.2.1
  - System.Communication-4.0.0
entities:
  # --------------------------------------------------------------------------
  # Pipeline 1b: PDF ingest via OCR (bronze)
  # POST multipart/form-data: file=<pdf> plus optional form fields
  # sourceSystem, sourceUri. Example:
  #   curl -k -X POST .../<tenant>/knowledge-capture/ingest-pdf \
  #     -F "file=@report.pdf" -F "sourceSystem=Zenon" -F "sourceUri=..."
  # --------------------------------------------------------------------------
  - rtId: '67200000000000000000000d'
    ckTypeId: System.Communication/Pipeline
    rtWellKnownName: wiki-capture-ingest-pdf
    associations:
      - roleId: System/ParentChild
        targetRtId: '672000000000000000000004'
        targetCkTypeId: System.Communication/DataFlow
      - roleId: System.Communication/Executes
        targetRtId: '670000000000000000000002'
        targetCkTypeId: System.Communication/Adapter
    attributes:
      - id: System/Name
        value: Wiki Capture - Ingest PDF (OCR)
      - id: System/Description
        value: >-
          Bronze-layer ingest for PDF artifacts (e.g. support/professional
          services reports): multipart upload -> extraction ladder
          (text layer -> OCR) -> SourceArtifact. Extracted text becomes
          Content, the tier used is persisted as ExtractionTier. The
          original PDF stays in its system of record (SourceUri).
      - id: System/Enabled
        value: true
      - id: System.Communication/DeploymentState
        value: 0   # Undeployed
      - id: System.Communication/IsDebuggingEnabled
        value: false
      - id: System.Communication/PipelineDefinition
        value: |-
          triggers:
            - type: FromHttpRequest@1
              method: POST
              path: /knowledge-capture/ingest-pdf
              description: 'multipart/form-data: file=<pdf>, optional form fields sourceSystem, sourceUri.'
          transformations:
            - type: PdfOcrExtraction@1
              description: >-
                Extract text via the extraction ladder: text layer (lossless for
                born-digital PDFs) -> OCR for pages without one.
                The tier used is persisted on the artifact (ExtractionTier).
              language: en
              maxFileSizeBytes: 20000000
              continueOnError: false
              preferTextLayer: true
              path: $.files[0].data
              targetPath: $.ocrText
            - type: CreateUpdateInfo@1
              description: Create the SourceArtifact (bronze) from the OCR text.
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: INSERT
              ckTypeId: KnowledgeCapture/SourceArtifact
              rtIdPath: $.newArtifactRtId
              generateRtId: true
              attributeUpdates:
                - attributeName: Name
                  attributeValueType: String
                  valuePath: $.files[0].fileName
                - attributeName: ArtifactType
                  attributeValueType: Enum
                  value: SupportReport
                - attributeName: SourceSystem
                  attributeValueType: String
                  valuePath: $.formData.sourceSystem
                - attributeName: SourceUri
                  attributeValueType: String
                  valuePath: $.formData.sourceUri
                - attributeName: Content
                  attributeValueType: String
                  valuePath: $.ocrText
                - attributeName: IsPiiRedacted
                  attributeValueType: Boolean
                  value: false
                - attributeName: ExtractionTier
                  attributeValueType: Enum
                  valuePath: $.ExtractionTier   # tier member name emitted by PdfOcrExtraction@1
            - type: ApplyChanges@2
              description: Persist the source artifact.
              entityUpdatesPath: $._updateItems
