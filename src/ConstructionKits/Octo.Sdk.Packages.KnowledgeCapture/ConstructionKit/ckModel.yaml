$schema: https://schemas.meshmakers.cloud/construction-kit-meta.schema.json
modelId: KnowledgeCapture-1.0.0
description: >
  GenAI-based knowledge capture for SME business processes. Transforms weakly
  structured business artifacts (work items, commit histories, chats, meeting
  transcripts, support reports) into structured, human-verified wiki entries.
  Follows a medallion layering inside this domain model: SourceArtifact (bronze,
  raw), WikiEntry (silver, audience-neutral, verified once), WikiRendition
  (gold, audience-specific). Based on the design of "System Designs for
  GenAI-Based Knowledge Capture in SME Business Processes" (Schwaab, 2026).
dependencies:
  - Basic-[2.0,3.0)
