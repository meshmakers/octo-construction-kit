$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
enums:
  - enumId: VerificationStatus
    description: 'Human-in-the-loop verification state of a generated wiki entry. Entries are created as Draft by pipelines; a human reviewer promotes them. Only Verified entries should be rendered for audiences or consumed downstream (the data-product quality gate).'
    isExtensible: false
    values:
      - key: 0
        name: Draft
        description: 'Generated by a pipeline, not yet reviewed by a human.'
      - key: 1
        name: InReview
        description: 'A human reviewer is actively reviewing/editing the entry.'
      - key: 2
        name: Verified
        description: 'Reviewed and approved by a human. Eligible for audience rendition and downstream consumption.'
      - key: 3
        name: Rejected
        description: 'Reviewed and rejected. Kept for auditability; excluded from downstream consumption.'
