$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
types:
- typeId: CkHealthMonitorConfig
  description: Configuration for the CK health monitoring pipeline (endpoints, credentials, Dash0 ingress). Keep exactly one entity per monitoring tenant.
  derivedFromCkTypeId: ${System}/Entity-1
  displayNameRule: "${Name}"
  attributes:
  - id: ${System}/Name-1
    name: Name
  - id: ${System}/Description-1
    name: Description
    isOptional: true
  - id: ${this}/TokenUrl-1
    name: TokenUrl
  - id: ${this}/AssetServicesBaseUrl-1
    name: AssetServicesBaseUrl
  - id: ${this}/ClientId-1
    name: ClientId
  - id: ${this}/ClientSecret-1
    name: ClientSecret
  - id: ${this}/Scope-1
    name: Scope
  - id: ${this}/Dash0IngressUrl-1
    name: Dash0IngressUrl
  - id: ${this}/Dash0AuthToken-1
    name: Dash0AuthToken
  - id: ${this}/Dash0Dataset-1
    name: Dash0Dataset
  # Deprecated, see the attribute description. Optional so an entity written against
  # Monitoring 1.0.0 stays valid.
  - id: ${this}/TeamsWebhookUrl-1
    name: TeamsWebhookUrl
    isOptional: true
- typeId: MonitoredTenant
  description: A tenant watched by monitoring pipelines (e.g. the CK health check). Create one entity per tenant to monitor.
  derivedFromCkTypeId: ${System}/Entity-1
  displayNameRule: "${Name}"
  attributes:
  - id: ${System}/Name-1
    name: Name
  - id: ${System}/Description-1
    name: Description
    isOptional: true
  - id: ${this}/TenantId-1
    name: TenantId
- typeId: BlueprintHealthMonitorConfig
  description: >-
    Configuration for the blueprint installation health pipeline. Keep exactly one entity per
    tenant that is monitored - unlike the CK health monitor, this one runs INSIDE the tenant it
    watches, because System/BlueprintInstallation entities live in the tenant's own runtime
    repository and a client-credentials token cannot cross a tenant boundary (AB#5032/AB#5077).
    AssetServicesBaseUrl/TokenUrl/ClientId/ClientSecret/Scope are used only for the catalog drift
    check, which calls {base}/{tenantId}/v1/blueprints/updates for THIS tenant - no client
    mirroring and no acr_values tenant selection are involved.
  derivedFromCkTypeId: ${System}/Entity-1
  displayNameRule: "${Name}"
  attributes:
  - id: ${System}/Name-1
    name: Name
  - id: ${System}/Description-1
    name: Description
    isOptional: true
  # Seeded from the blueprint variable ${octo.tenantId} at install time, so the metric can carry
  # octo.tenant.id without anyone typing it. A pipeline has no other way to learn which tenant it
  # runs in: no node exposes the ambient tenant id to the DataContext.
  - id: ${this}/TenantId-1
    name: TenantId
  - id: ${this}/TokenUrl-1
    name: TokenUrl
  - id: ${this}/AssetServicesBaseUrl-1
    name: AssetServicesBaseUrl
  - id: ${this}/ClientId-1
    name: ClientId
  - id: ${this}/ClientSecret-1
    name: ClientSecret
  - id: ${this}/Scope-1
    name: Scope
  - id: ${this}/Dash0IngressUrl-1
    name: Dash0IngressUrl
  - id: ${this}/Dash0AuthToken-1
    name: Dash0AuthToken
  - id: ${this}/Dash0Dataset-1
    name: Dash0Dataset
- typeId: ExpectedBlueprint
  description: >-
    A blueprint this tenant is meant to be running. One entity per blueprint. The list is the ONLY
    way a failed installation becomes observable: a failed apply writes no installation row, no
    history entry and no error entity anywhere in the tenant, so "should be here and is not" is
    the only detectable shadow it casts. An empty list is valid and simply disables that check;
    the catalog drift check needs no entries at all.
  derivedFromCkTypeId: ${System}/Entity-1
  displayNameRule: "${Name}"
  attributes:
  - id: ${System}/Name-1
    name: Name
  - id: ${System}/Description-1
    name: Description
    isOptional: true
  - id: ${this}/BlueprintName-1
    name: BlueprintName
